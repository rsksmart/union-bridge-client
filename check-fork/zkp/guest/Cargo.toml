[package]
name = "check-fork-guest"
version = "0.4.0"
license = "MIT"
edition = "2024"

[workspace]

[dependencies]
bincode = "1.3.3" # intentional older version
check-fork = { path = "../../../check-fork" }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ['std'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple-crate-versions = "allow"
cargo-common-metadata = "allow"
