[package]
name = "check-fork-tester"
version.workspace = true
license.workspace = true
edition = "2024"

[[bin]]
name = "check-fork-tester"

[dependencies]

bitcoin = { workspace = true }
check-fork = { path = ".." }
chrono = "0.4.42"
clap = { version = "4.5.51", features = ["derive"] }
hex = "0.4.3"
methods = { package = "check-fork-zkp", path = "../zkp" }
primitive-types = { version = "0.13.1", features = ["serde"] }
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.41.1", features = ["rt-multi-thread", "macros"] }
zkvm_cli_serde = { package = "cli_serde", git = "https://github.com/FairgateLabs/rust-bitvmx-zk-proof.git", tag = "v0.6.1" }

[lints]
workspace = true
