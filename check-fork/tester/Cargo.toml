[package]
name = "check-fork-tester"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "check-fork-tester"

[lints]
workspace = true

[dependencies]
check-fork = { path = ".." }

bitcoin = { workspace = true }
clap = { version = "4.5.30", features = ["derive"] }
chrono = "0.4.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
primitive-types = { version = "0.13.1", features = ["serde"] }
methods = { package = "check-fork-zkp", path = "../zkp" }
zkvm_cli_serde = { package = "cli_serde", git = "ssh://git@github.com/FairgateLabs/rust-bitvmx-zk-proof.git", branch = "main" }
reqwest = { version = "0.12.15", features = ["json"] }
tokio = { version = "1.41.1", features = ["rt-multi-thread", "macros"] }
