[package]
name = "generate_elf_demo"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
bitcoin = "0.32.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
primitive-types = { version = "0.13.1", features = ["std", "serde"] }
check_fork = { git = "ssh://git@github.com/rsksmart/union-bridge-check-fork.git", tag = "0.1.0" }
zkvm_guest = { path = "../zkvm_guest" }
zkvm_cli_serde = { package = "cli_serde", path = "../zkvm_host/cli_serde" }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
