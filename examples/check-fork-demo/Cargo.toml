[workspace]

[package]
name = "check-fork-demo"
version = "0.1.0"
edition = "2024"
resolver = "2"

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true

[dependencies]
bitcoin = "0.32.4"
clap = { version = "4.5.30", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
primitive-types = { version = "0.13.1", features = ["std", "serde"] }
check-fork = { path = "../../check-fork" }
methods = { path = "methods" }
zkvm_cli_serde = { package = "cli_serde", git = "ssh://git@github.com/FairgateLabs/rust-bitvmx-zk-proof.git", branch = "poc-generalise-host" }
reqwest = { version = "0.12.15", features = ["json"] }
tokio = { version = "1", features = ["full"] }