[package]
name = "common"
version.workspace = true
license.workspace = true
rust-version.workspace = true
edition = "2024"

[features]
anvil = []

[dependencies]
alloy-contract = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true, features = ["ws"] }
alloy-pubsub = { workspace = true }
alloy-rpc-client = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-transport = { workspace = true }
anyhow = { workspace = true }
bitcoin = { workspace = true }
bitvmx-emulator = { git = "https://github.com/FairgateLabs/BitVMX-CPU.git", tag = "v0.5.11", package = "emulator" }
broker-storage-backend = { package = "rust-bitvmx-storage-backend", git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", tag = "v0.6.1" }
config = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
log4rs = { workspace = true }
lru = "0.16"
message-broker = { workspace = true, features = ["storagebackend"] }
mockall = { workspace = true }
musig2 = { workspace = true }
primitive-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
sha3 = "0.10.8"
signal-hook = "0.3.18"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid = { version = "1.11.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
