[package]
name = "common"
version.workspace = true
license.workspace = true
rust-version.workspace = true
edition = "2024"

[features]
anvil = []

[dependencies]
alloy-contract = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true, features = ["ws"] }
alloy-pubsub = { workspace = true }
alloy-rpc-client = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-transport = { workspace = true }
anyhow = { workspace = true }
bitcoin = { workspace = true }
bitvmx-emulator = { git = "https://github.com/FairgateLabs/BitVMX-CPU.git", tag = "v0.5.11", package = "emulator" }
# Corresponds to tag v0.6.1.
broker-storage-backend = { package = "rust-bitvmx-storage-backend", git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", rev = "eb01167404c20564fcee9db2d641bf88fb4df927" }
chrono = { workspace = true }
config = { workspace = true }
hex = { workspace = true }
lru = "0.16"
message-broker = { workspace = true, features = ["storagebackend"] }
mockall = { workspace = true }
musig2 = { workspace = true }
primitive-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
sha3 = "0.11.0"
signal-hook = "0.3.18"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

# cargo-husky installs the git hooks from `.cargo-husky/hooks/` the first time
# `common`'s dev-dependencies are compiled after clone (e.g. `cargo test` or
# `cargo test --no-run`; a plain `cargo build` does not pull in dev-deps).
# `user-hooks` disables its built-in default hooks; we use our own scripts.
[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
tempfile = { workspace = true }

[lints]
workspace = true
