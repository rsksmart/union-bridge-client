[package]
name = "monitor"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
bitcoin = "0.32.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
primitive-types = { version = "0.13.1", features = ["std", "serde"] }
log = "0.4.22"
anyhow = "1.0.94"
env_logger = "0.11.5"
storage_backend = { package = "rust-bitvmx-storage-backend", path = "../../rust-bitvmx-storage-backend" }
alloy-provider = { version = "0.8.1", features = ["ws"] }
alloy-rpc-types = "0.8.1"
alloy-pubsub = { version = "0.8.1" }
ctrlc = "3.4"
tokio = { version = "1.41.1", features = ["rt-multi-thread"] }
dotenv = "0.15"
lru = "0.12.5"