[package]
name = "monitor"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
bitcoin = "0.32.4"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
hex = "0.4.3"
chrono = "0.4.38"
check_fork = { git = "ssh://git@github.com/rsksmart/union-bridge-check-fork.git", tag = "0.1.0" }
primitive-types = { version = "0.13.1", features = ["std", "serde"] }
zkvm = { package = "host", path = "../zkp/host", version = "0.1.0" } # "../zkp" is a symlink, check README.md::Setup for more context