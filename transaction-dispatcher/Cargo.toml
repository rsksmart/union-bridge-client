[package]
name = "transaction-dispatcher"
version = "0.1.0"
edition = "2024"

[dependencies]
actors-mocking = { path = "../actors-mocking" }
common = { path = "../common" }
key-manager = { path = "../key-manager" }

alloy-contract = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true, features = ["ws"] }
alloy-rpc-types = { workspace = true, features = ["debug"] }
alloy-sol-types = { workspace = true, features = ["json"] }
alloy-transport = { workspace = true }
anyhow = { workspace = true }
bitcoin = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
musig2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
union-contracts = { workspace = true }

axum = "0.8.1"
# bitcoin = { version = "0.32.4", features = ["std", "rand-std", "serde"] }
tower-http = { version = "0.6.1", features = ["timeout", "trace"] }

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }
