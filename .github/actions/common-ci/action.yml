name: 'Common CI'
description: 'Common CI tasks for the Union Bridge Client'

inputs:
  fairgate_github_token:
    description: 'GitHub token for accessing FairgateLabs repositories'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      if: ${{ env.ACT }}
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Rust
      if: ${{ env.ACT }}
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: 'true'
        cache-workspaces: |
          union-bridge-client
          rust-bitvmx-workspace/rust-bitvmx-client

    - name: Install RocksDB Dependencies
      if: ${{ env.ACT }}
      shell: bash
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libclang-dev clang

    - name: Cache RISC Zero
      id: cache-risc0
      uses: actions/cache@v3
      with:
        path: ~/.risc0
        key: ${{ runner.os }}-risc0-v0.4.1
        restore-keys: |
          ${{ runner.os }}-risc0-

    - name: Install RiscZero
      shell: bash
      run: |
        curl -L https://risczero.com/install | bash
        ~/.risc0/bin/rzup install

    - name: Cache Dependencies
      if: ${{ ! env.ACT }}
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          ~/.cargo/registry
          ~/.cargo/git
          ./target
          rust-bitvmx-workspace/rust-bitvmx-client/target
        key: ${{ runner.os }}-rust-cargo-${{ hashFiles('./Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-cargo-

      # TODO(jira) https://rsklabs.atlassian.net/browse/ub-176
    - name: Checkout BitVMX workspace
      uses: actions/checkout@v4
      with:
        repository: FairgateLabs/rust-bitvmx-workspace
        token: ${{ inputs.fairgate_github_token }}
        ref: f5d15597ee27f9a659498ef5fb86f4ecee094d51
        path: rust-bitvmx-workspace
        submodules: recursive
        fetch-depth: 0