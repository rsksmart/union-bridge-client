name: "Build Tests"
description: "Builds the union-bridge-client"

inputs:
  fairgate_github_token:
    description: "GitHub token for accessing private dependency repositories (e.g. BitVMX)"
    required: true
  contracts_github_token:
    description: "GitHub token for accessing temp-rsk org contracts repository"
    required: true
  cache-build:
    description: "Wether dependencies should be cached"
    required: true

runs:
  using: "composite"
  steps:

    - name: Set up Node.js
      if: ${{ env.ACT }}
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Rust
      if: ${{ env.ACT }}
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: false
        rustflags: '' # this action errors on warnings by default via RUSTFLAGS, so we need to clear them

    - name: Install RocksDB Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libclang-dev clang lld

    - name: Cache RISC Zero
      id: cache-risc0
      uses: actions/cache@v3
      with:
        path: ~/.risc0
        key: ${{ runner.os }}-risc0-v0.4.1
        restore-keys: |
          ${{ runner.os }}-risc0-

    - name: Install RISC Zero
      if: steps.cache-risc0.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -L https://risczero.com/install | bash
        ~/.risc0/bin/rzup install

    - name: Cache Build
      if: ${{ inputs.cache-build == 'true' }}
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ./target
        key: ${{ runner.os }}-rust-cargo-${{ hashFiles('./Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-cargo-

    - name: Fix private repo dependency cloning (BitVMX / dependencies)
      shell: bash
      run: |
        git config --global \
          url."https://${{ inputs.fairgate_github_token }}@github.com/FairgateLabs".insteadOf \
          "ssh://git@github.com/FairgateLabs"

    - name: Fix temp-rsk private repo dependency cloning
      shell: bash
      run: |
        git config --global \
          url."https://${{ inputs.contracts_github_token }}@github.com/temp-rsk".insteadOf \
          "ssh://git@github.com/temp-rsk"