name: Build Tests

permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: union-bridge-client

      - name: Act Setup
        if: ${{ env.ACT }}
        uses: ./union-bridge-client/.github/actions/act_setup

      - name: Checkout BitVMX workspace
        uses: actions/checkout@v4
        with:
          repository: FairgateLabs/rust-bitvmx-workspace
          token: ${{ secrets.FAIRGATE_GITHUB_TOKEN }}
          ref: f5d15597ee27f9a659498ef5fb86f4ecee094d51
          path: rust-bitvmx-workspace
          submodules: recursive
          fetch-depth: 0

      - name: Cache RISC Zero
        id: cache-risc0
        uses: actions/cache@v3
        with:
          path: ~/.risc0
          key: ${{ runner.os }}-risc0-v0.4.1
          restore-keys: |
            ${{ runner.os }}-risc0-

      - name: Install RISC Zero
        run: |
          curl -L https://risczero.com/install | bash
          ~/.risc0/bin/rzup install

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            ./target
            rust-bitvmx-workspace/rust-bitvmx-client/target
          key: ${{ runner.os }}-rust-cargo-${{ hashFiles('./Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-cargo-

      # we cannot use upload/download artifacts with act, it's sooo slow
      - name: Build Artifacts
        if: ${{ ! env.ACT }}
        working-directory: union-bridge-client
        run: |
          git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/FairgateLabs".insteadOf "https://github.com/FairgateLabs"
          git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/FairgateLabs".insteadOf "git@github.com:FairgateLabs"
          git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/FairgateLabs".insteadOf "ssh://git@github.com/FairgateLabs"
          cargo build --workspace --exclude actors-mocking
          cargo build -p actors-mocking --features anvil
          cargo build --manifest-path qa-tools/Cargo.toml

      # we cannot use upload/download artifacts with act, it's sooo slow
      - name: Upload build artifacts
        if: ${{ ! env.ACT }}
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            union-bridge-client/target
            union-bridge-client/qa-tools/target
            rust-bitvmx-workspace/rust-bitvmx-client/target
