name: Automated Tests (Local)

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main
  merge_group:
    types: [ checks_requested ]
    branches:
      - main

jobs:
  automated-tests:
    name: 'Automated Tests'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust installation
        uses: actions/cache@v3
        with:
          path: |
            ~/.rustup
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install RocksDB Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libclang-dev clang

      - name: Cache RISC Zero
        id: cache-risc0
        uses: actions/cache@v3
        with:
          path: ~/.risc0
          key: ${{ runner.os }}-risc0-v0.4.1
          restore-keys: |
            ${{ runner.os }}-risc0-

      - name: Install RISC Zero
        if: steps.cache-risc0.outputs.cache-hit != 'true'
        run: |
          curl -L https://risczero.com/install | bash
          ~/.risc0/bin/rzup install

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for Git access
        run: |
          if [ -n "$SSH_AUTH_SOCK" ]; then
            echo "SSH agent socket found at $SSH_AUTH_SOCK"
            ssh-add -l || echo "No keys in SSH agent"
            ssh -T git@github.com || echo "SSH test completed"
          else
            echo "No SSH_AUTH_SOCK found, using HTTPS fallback"
            git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          fi

      - name: Fix Fairgate Git access
        run: |
          # Only configure HTTPS if SSH is not available
          if [ -z "$SSH_AUTH_SOCK" ]; then
            git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          fi

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-rust-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-cargo-

      - name: Run tests
        run: RUN_MODE=ci cargo test --features test-utils 