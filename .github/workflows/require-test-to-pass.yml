name: Automated Tests

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main
  merge_group:
    types: [ checks_requested ]
    branches:
      - main

jobs:
  automated-tests:
    name: 'Automated Tests'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:

      ########################################
      ### Needed for local tests with act ###
      ########################################
      #      - name: Set up Rust
      #        uses: actions-rust-lang/setup-rust-toolchain@v1
      #
      #      - name: Cache Rust installation
      #        uses: actions/cache@v4
      #        with:
      #          path: |
      #            ~/.rustup
      #          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
      #          restore-keys: |
      #            ${{ runner.os }}-rust-
      #
      #      - name: Install RocksDB Dependencies
      #        run: |
      #          sudo apt-get update
      #          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libclang-dev clang
      ########################################

      - name: Fix Fairgate Git access
        run: |
          git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache RocksDB
        id: cache-rocksdb
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/librocksdb.a
          key: ${{ runner.os }}-rocksdb
          restore-keys: |
            ${{ runner.os }}-rocksdb

      - name: Install RocksDB
        id: install-rocksdb
        continue-on-error: true # it will be built by cargo, useful for local tests where the version installed is not compatible
        if: steps.cache-rocksdb.outputs.cache-hit != 'true'
        run: |
          sudo apt update && sudo apt install -y librust-librocksdb-sys-dev

      - name: Set RocksDB env vars if installed
        if: steps.install-rocksdb.outcome == 'success'
        run: |
          echo "ROCKSDB_LIB_DIR=/usr/lib" >> $GITHUB_ENV
          echo "ROCKSDB_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-rust-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-cargo-

      - name: Run tests
        run: cargo test --all-features
