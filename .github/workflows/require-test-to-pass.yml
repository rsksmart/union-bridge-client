name: Automated Tests

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main
  merge_group:
    types: [ checks_requested ]
    branches:
      - main

jobs:
  automated-tests:
    name: 'Automated Tests'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Detect environment
        id: check-act
        run: |
          if [ -n "$ACT" ]; then
            echo "flag=true" >> $GITHUB_OUTPUT
            echo "====ACT"
          else
            echo "flag=false" >> $GITHUB_OUTPUT
            echo "====NOOOO"
          fi

      - name: Set up Rust (if running in act)
        if: steps.check-act.outputs.flag == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust installation (if running in act)
        if: steps.check-act.outputs.flag == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache RocksDB
        id: cache-rocksdb
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/x86_64-linux-gnu/librocksdb*
            /usr/include/rocksdb/
          key: ${{ runner.os }}-rocksdb2
          restore-keys: |
            ${{ runner.os }}-rocksdb2

      - name: Install RocksDB (if running in act)
        if: steps.check-act.outputs.flag == 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libclang-dev clang

      - name: Install RocksDB (if running in GitHub)
        if: steps.check-act.outputs.flag == 'false' && steps.cache-rocksdb.outputs.cache-hit == 'false'
        run: |
          sudo apt-get update
          sudo apt install -y librocksdb-dev llvm-dev libclang-dev clang bzip2 liblz4-dev libzstd-dev libsnappy-dev zlib1g-dev


      - name: Set RocksDB env vars (if running in GitHub)
        if: steps.check-act.outputs.flag == 'false' # do not use this approach in act, as it fails to build rocksdb due to available ubuntu packages for latest
        run: |
          echo "ROCKSDB_LIB_DIR=/usr/lib" >> $GITHUB_ENV
          echo "ROCKSDB_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Fairgate Git access
        run: |
          git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-rust-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-cargo-

      - name: Build
        run: cargo build --all-features

      - name: Run tests
        run: cargo test --all-features
