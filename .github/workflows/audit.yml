name: Audit

permissions:
  contents: read

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]
    branches:
      - main
  push:
    tags:
      - 'v*'
  schedule:
    # Weekly run picks up advisories filed against already-merged deps,
    # which a PR-triggered run would miss until the next PR.
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # v2.81.2
        with:
          tool: cargo-audit

      - name: Run cargo-audit (root workspace)
        run: cargo audit --color never 2>&1 | tee audit.txt && exit ${PIPESTATUS[0]}

      - name: Run cargo-audit (cli workspace)
        run: cargo audit --file cli/Cargo.lock --color never 2>&1 | tee audit-cli.txt && exit ${PIPESTATUS[0]}

      - name: Publish audit summary
        if: always()
        run: |
          {
            echo "## cargo audit — root workspace"
            echo ""
            echo '```'
            cat audit.txt
            echo '```'
            echo ""
            echo "## cargo audit — cli workspace"
            echo ""
            echo '```'
            cat audit-cli.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
