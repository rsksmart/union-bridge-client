name: Audit

permissions:
  contents: read

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]
    branches:
      - main
  push:
    tags:
      - 'v*'
  schedule:
    # Weekly run picks up advisories filed against already-merged deps,
    # which a PR-triggered run would miss until the next PR.
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e # v2.79.1
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        # RUSTSEC-2023-0071 (rsa Marvin Attack): no upstream fix available
        # since 2023-11. Tracking at
        # https://rustsec.org/advisories/RUSTSEC-2023-0071
        run: cargo audit --ignore RUSTSEC-2023-0071
