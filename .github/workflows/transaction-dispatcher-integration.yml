name: Integration Tests
permissions:
  contents: read
on:
  push:
    paths:
      - 'transaction-dispatcher/**'
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEPLOY_LOCAL_CONTRACTS_PATH: "../../bitvmx-union-bridge-contracts/shell/script/deploy/deploy-local.sh"
      TX_DISPATCHER_URL: "http://localhost:3000"
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      TX_DISPATCHER_CONFIG_PATH: "../config/ci"
    steps:

      - name: Set up Node.js
        if: ${{ env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Rust
        if: ${{ env.ACT }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Install RocksDB Dependencies
        if: ${{ env.ACT }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libclang-dev clang

      - name: Install Foundry # enables RPC caching
        uses: foundry-rs/foundry-toolchain@v1

      - name: Add Foundry to PATH
        run: echo "$HOME/.foundry/bin" >> $GITHUB_PATH

      - name: Checkout code and submodules
        uses: actions/checkout@v4

      - name: Clone contracts
        run: |
          rm -rf ../bitvmx-union-bridge-contracts
          git clone --branch v0.0.1-alpha.1 https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/FairgateLabs/bitvmx-union-bridge-contracts.git ../bitvmx-union-bridge-contracts

      - name: Checkout BitVMX
        run: |
          rm -rf ../rust-bitvmx-workspace
          git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/FairgateLabs".insteadOf "https://github.com/FairgateLabs"
          git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/FairgateLabs".insteadOf "git@github.com:FairgateLabs"
          git clone --recursive --rev f5d15597ee27f9a659498ef5fb86f4ecee094d51 git@github.com:FairgateLabs/rust-bitvmx-workspace ../rust-bitvmx-workspace


      - name: Run integration tests
        working-directory: qa-tools
        run: |
          git config --global url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/FairgateLabs".insteadOf "ssh://git@github.com/FairgateLabs"
          mkdir -p reports
          JUNIT_REPORT="reports/tx_dispatcher.xml" RUST_BACKTRACE=1 cargo run --bin qa-tools-transaction-dispatcher -- --tags @transaction-dispatcher
          cat reports/tx_dispatcher.xml

