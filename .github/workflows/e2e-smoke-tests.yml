name: E2E Smoke Tests

# This workflow triggers E2E smoke tests in the union_bridge_e2e_framework repo
# It runs when a PR is ready for review or updated, creating a required status check
# that must pass before the PR can be merged.
#
# Architecture:
# - Client repo (this file): Triggers on PR events, calls e2e_framework workflow
# - E2E Framework repo: Contains the actual test execution workflow
# This split allows:
#   1. Tests to run automatically before PR merge (required status check)
#   2. E2E framework tests to run independently when needed
#   3. Clear separation of concerns
#
# IMPORTANT: To prevent merges when tests fail:
# 1. Configure branch protection rules for 'main' branch
# 2. Require status check 'e2e-smoke-tests' to pass before merging
# 3. The e2e_framework workflow updates this status check when tests complete

permissions:
  contents: read
  statuses: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      client_ref:
        description: 'union-bridge-client ref (branch/tag/sha). PR: head SHA; manual: empty = current commit'
        type: string
        default: ''
      pr_head_sha:
        description: 'Commit SHA for status check (e2e-smoke.yml updates it). PR: head SHA; manual: empty = client_ref/github.sha'
        type: string
        default: ''

jobs:
  trigger-e2e-tests:
    name: Trigger E2E Smoke Tests
    runs-on: ubuntu-latest
    # Only run if PR is not a draft (or manual dispatch)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'

    steps:
      - name: Call E2E Framework Workflow
        uses: actions/github-script@v7
        env:
          E2E_FRAMEWORK_TOKEN: ${{ secrets.E2E_FRAMEWORK_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # Matches e2e-smoke.yml workflow_dispatch inputs: client_ref, pr_head_sha (contracts_ref sent as '' = use framework defaults)
          CLIENT_REF: ${{ inputs.client_ref || github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha || github.event.pull_request.head.sha || inputs.client_ref || github.sha }}
        with:
          script: |
            const clientRef = process.env.CLIENT_REF;
            const prHeadSha = process.env.PR_HEAD_SHA;
            const prNumber = context.payload.pull_request?.number;
            
            console.log(`🚀 Triggering E2E smoke tests for client ref: ${clientRef}`);
            if (prNumber) {
              console.log(`📋 PR #${prNumber}`);
            }
            console.log(`📍 PR head SHA for status check: ${prHeadSha}`);

            // Use the token to call the workflow (name 'api' to avoid conflict with action-injected 'octokit')
            const token = process.env.E2E_FRAMEWORK_TOKEN;
            const api = github.getOctokit(token);
            
            try {
              // Call the e2e_framework workflow via workflow_dispatch
              await api.rest.actions.createWorkflowDispatch({
                owner: 'rsksmart',
                repo: 'union_bridge_e2e_framework',
                workflow_id: 'e2e-smoke.yml',
                ref: 'main', // Use main branch of e2e_framework
                inputs: {
                  client_ref: clientRef,
                  contracts_ref: '', // Use default from versions.yml
                  pr_head_sha: prHeadSha // Pass PR head SHA so e2e_framework can update status check
                }
              });

              console.log('✅ E2E smoke tests triggered successfully');
              
              // Create a status check on the PR head commit
              // This status check will be required before merge (via branch protection)
              // The e2e_framework workflow will update this status when tests complete
              if (prHeadSha && prHeadSha !== '') {
                await api.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: prHeadSha,
                  state: 'pending',
                  target_url: `https://github.com/rsksmart/union_bridge_e2e_framework/actions`,
                  description: `E2E smoke tests running for ${clientRef}`,
                  context: 'e2e-smoke-tests'
                });
                console.log(`✅ Status check set to 'pending' on commit ${prHeadSha}`);
                console.log(`📝 Configure branch protection to require 'e2e-smoke-tests' status check`);
              }
            } catch (error) {
              console.error('❌ Failed to trigger E2E smoke tests:', error);
              if (prHeadSha && prHeadSha !== '') {
                await api.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: prHeadSha,
                  state: 'error',
                  target_url: `https://github.com/rsksmart/union_bridge_e2e_framework/actions`,
                  description: `Failed to trigger E2E smoke tests: ${error.message}`,
                  context: 'e2e-smoke-tests'
                });
              }
              core.setFailed(`Failed to trigger E2E smoke tests: ${error.message}`);
            }
