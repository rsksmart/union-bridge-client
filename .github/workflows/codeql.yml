name: CodeQL-Advanced

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main
  merge_group:
    types: [ checks_requested ]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            # temporary disable, as Rust support is not prod ready
          #- language: rust
          #  build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          fairgate_github_token: ${{ secrets.FAIRGATE_GITHUB_TOKEN }}
          contracts_github_token: ${{ secrets.UNION_CONTRACTS_GITHUB_TOKEN }}
          cache-build: false

      # required due to check-fork/zkp/build.rs
      - name: Build with Cargo
        if: matrix.language == 'rust'
        run: |
          cd check-fork/zkp
          cargo build

      # initialize CodeQL pointing at the real root of client code
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        # enable for debugging
        # env:
          # CODEQL_EXTRACTOR_RUST_OPTION_LOGGING_VERBOSITY: debug
        with:
          category: "/language:${{ matrix.language }}"
