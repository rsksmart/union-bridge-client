name: CodeQL-Advanced

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - fake-just-disabling # TODO restore main when CodeQL for rust is out of preview
  merge_group:
    types: [ checks_requested ]
    branches:
      - fake-just-disabling # TODO restore main when CodeQL for rust is out of preview
  push:
    branches:
      - fake-just-disabling # TODO restore main when CodeQL for rust is out of preview

jobs:
  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          fairgate_github_token: ${{ secrets.FAIRGATE_GITHUB_TOKEN }}
          cache-build: false

      - name: Build Main Workspace
        if: matrix.language == 'rust'
        run: |
          cargo build          

      - name: Build CheckFork Workspace
        if: matrix.language == 'rust'
        working-directory: check-fork/zkp
        run: |
          cargo build

      # initialize CodeQL pointing at the real root of client code
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          packs: codeql/rust-all
          config: |
            name: "CodeQL Config"
            paths-ignore:
              - 'actors-mocking/**'
              - 'qa-tools/**'
              - '.hooks/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        # enable for debugging
        # env:
          # CODEQL_EXTRACTOR_RUST_OPTION_LOGGING_VERBOSITY: debug
        with:
          category: "/language:${{ matrix.language }}"
