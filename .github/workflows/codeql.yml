name: CodeQL-Advanced

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main
  merge_group:
    types: [ checks_requested ]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            # temporary disable, as Rust support is not prod ready
          #- language: rust
          #  build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          cache-build: false

      # required due to check-fork/zkp/build.rs
      - name: Build with Cargo
        if: matrix.language == 'rust'
        run: |
          cd check-fork/zkp
          cargo build

      # initialize CodeQL pointing at the real root of client code
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        # enable for debugging
        # env:
          # CODEQL_EXTRACTOR_RUST_OPTION_LOGGING_VERBOSITY: debug
        with:
          category: "/language:${{ matrix.language }}"
