name: Style

permissions:
  contents: read

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main
  merge_group:
    types: [ checks_requested ]
    branches:
      - main

jobs:
  style:
    runs-on: ubuntu-latest

    steps:

      # cannot be moved to common_setup action because its needed to find the action itself
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          cache-build: true

      - name: Install cargo-sort
        uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # v2.81.2
        with:
          tool: cargo-sort

      # check code formatting
      - name: Check Code Formatting
        run: |
          rustup component add rustfmt --toolchain nightly
          bash .hooks/format-code.sh --check

      - name: Check Clippy rules
        run: bash .hooks/check-lints.sh
