name: Tests

permissions:
  contents: read

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]
    branches:
      - main

jobs:
  test-workspace:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:

      # cannot be moved to common_setup action because its needed to find the action itself
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          cache-build: true

      - name: Test Prod
        run: |
          cargo test --workspace --locked

      - name: Test Features
        run: |
          cargo test --workspace --all-features --locked

      - name: Test cli workspace (Prod)
        run: |
          cargo test --manifest-path cli/Cargo.toml --workspace --locked

      - name: Test cli workspace (Features)
        run: |
          cargo test --manifest-path cli/Cargo.toml --workspace --all-features --locked

  check-all-targets:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:

      # cannot be moved to common_setup action because its needed to find the action itself
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          cache-build: true

      - name: Check All Targets
        run: |
          cargo check --workspace --all-targets --all-features --locked

      - name: Check Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --all-features --locked

      - name: Check Rustdoc (cli workspace)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --manifest-path cli/Cargo.toml --workspace --no-deps --all-features --locked
