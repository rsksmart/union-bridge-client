name: Tests

permissions:
  contents: read

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
    types: [ checks_requested ]
    branches:
      - main
  # Tag pushes run the coverage job so each release has a downloadable lcov.info.
  push:
    tags:
      - 'v*'

jobs:
  test-workspace:
    # Skip on tag pushes: those runs only exist to publish the coverage artifact.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:

      # cannot be moved to common_setup action because its needed to find the action itself
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          cache-build: true

      - name: Test Prod
        run: |
          cargo test --workspace --locked

      # The coverage job runs the all-features unit/integration tests under instrumentation,
      # but cargo-llvm-cov skips doctests on stable, so run the all-features doctests here.
      - name: Test Features (doctests)
        run: |
          cargo test --workspace --all-features --doc --locked

      - name: Test cli workspace (Prod)
        run: |
          cargo test --manifest-path cli/Cargo.toml --workspace --locked

      - name: Test cli workspace (Features)
        run: |
          cargo test --manifest-path cli/Cargo.toml --workspace --all-features --locked

  check-all-targets:
    # Skip on tag pushes: those runs only exist to publish the coverage artifact.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:

      # cannot be moved to common_setup action because its needed to find the action itself
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          cache-build: true

      - name: Check All Targets
        run: |
          cargo check --workspace --all-targets --all-features --locked

      - name: Check Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --all-features --locked

      - name: Check Rustdoc (cli workspace)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --manifest-path cli/Cargo.toml --workspace --no-deps --all-features --locked

  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      CARGO_PROFILE_TEST_DEBUG: 0
      RISC0_SKIP_BUILD: 1

    steps:

      # cannot be moved to common_setup action because its needed to find the action itself
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/common_setup
        with:
          cache-build: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # v2.81.8
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --workspace --all-features --locked \
            --ignore-filename-regex 'src/main\.rs' \
            --fail-under-lines 65 \
            --lcov --output-path lcov.info

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --ignore-filename-regex 'src/main\.rs'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov.info
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: warn
