name: "Semgrep Security Scan"

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '18 9 * * 1'

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: 'ubuntu-latest'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Checkout rules repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: rootstock/semgrep-rules-rust
        path: ./semgrep-rules

    - name: Run Semgrep
      # semgrep/semgrep:1.84.0 multi-arch manifest digest (linux/amd64 + linux/arm64).
      # Bump tag and digest together via `docker manifest inspect semgrep/semgrep:<tag>`.
      run: |
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/src" \
          -w /src \
          semgrep/semgrep@sha256:e792d418d128c4c7ea3842677192b7a06458747fbdbeda350a5cd2c7abbb7bbe \
          semgrep \
            --config=p/rust \
            --config=./semgrep-rules/security/ \
            --sarif \
            --output=semgrep.sarif \
            --verbose \
            --exclude user-api \
            --exclude actors-mocking \
            --exclude bitcoin-wallet \
            --exclude cli \
            --exclude "test*" \
            .
      continue-on-error: true

    - name: Upload SARIF file to GitHub
      uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      if: always()
      with:
        sarif_file: semgrep.sarif
        category: semgrep
