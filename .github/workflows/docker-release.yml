name: Build and Push Docker Images on Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: rsksmart/union-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: block-indexer
            title: Union Client Block Indexer
            description: Union Bridge Client Block Indexer Service
          - name: log-indexer
            title: Union Client Log Indexer
            description: Union Bridge Client Log Indexer Service
          - name: coordinator
            title: Union Client Coordinator
            description: Union Bridge Client Coordinator Service
          - name: user-api
            title: Union Client User API
            description: Union Bridge Client User API Service
        features:
          - variant: prod
            cargo_features: ""
            suffix: ""
          - variant: anvil
            cargo_features: anvil
            suffix: "-anvil"

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.crate.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag,suffix=${{ matrix.features.suffix }}
          labels: |
            org.opencontainers.image.title=${{ matrix.crate.title }}
            org.opencontainers.image.description=${{ matrix.crate.description }}
            org.opencontainers.image.vendor=RSK

      - name: Build and push ${{ matrix.crate.name }} (${{ matrix.features.variant }})
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./docker/build/Dockerfile.github-actions
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.crate.name }}-${{ matrix.features.variant }}
          cache-to: type=gha,mode=min,scope=${{ matrix.crate.name }}-${{ matrix.features.variant }}
          build-args: |
            CRATE=${{ matrix.crate.name }}
            FEATURES=${{ matrix.features.cargo_features }}

      - name: Clean up
        if: always()
        run: |
          docker buildx prune -af
          docker system prune -af --volumes
          df -h
