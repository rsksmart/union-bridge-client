name: Build and Push Docker Images on Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: rsksmart/union-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: block-indexer
            title: Union Client Block Indexer
            description: Union Bridge Client Block Indexer Service
          - name: log-indexer
            title: Union Client Log Indexer
            description: Union Bridge Client Log Indexer Service
          - name: coordinator
            title: Union Client Coordinator
            description: Union Bridge Client Coordinator Service
          - name: user-api
            title: Union Client User API
            description: Union Bridge Client User API Service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.crate.name }}
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=${{ matrix.crate.title }}
            org.opencontainers.image.description=${{ matrix.crate.description }}
            org.opencontainers.image.vendor=RSK

      - name: Configure Git dependency cloning
        run: |
          git config --global \
            url."https://${{ secrets.UNION_CONTRACTS_GITHUB_TOKEN }}@github.com/temp-rsk".insteadOf \
            "ssh://git@github.com/temp-rsk"

      - name: Build and push ${{ matrix.crate.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/build/Dockerfile.github-actions
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            CRATE=${{ matrix.crate.name }}
            FEATURES=anvil
            UNION_CONTRACTS_GITHUB_TOKEN=${{ secrets.UNION_CONTRACTS_GITHUB_TOKEN }}

      - name: Clean up
        if: always()
        run: |
          docker buildx prune -af
          docker system prune -af --volumes
          df -h
