name: Build and Push Docker Images on Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: rsksmart/union-client
  BUILDER_IMAGE_TAG: rust-1.95-v1

jobs:
  build-builder:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract builder metadata
        id: builder-meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-builder
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ env.BUILDER_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.title=Union Client Builder
            org.opencontainers.image.description=Union Bridge Client Rust Builder Image
            org.opencontainers.image.vendor=RSK

      - name: Build and push builder image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./docker/build
          file: ./docker/build/Dockerfile_builder
          platforms: linux/amd64
          push: true
          tags: ${{ steps.builder-meta.outputs.tags }}
          labels: ${{ steps.builder-meta.outputs.labels }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=min,scope=builder

      - name: Clean up
        if: always()
        run: |
          docker buildx prune -af
          docker system prune -af --volumes
          df -h

  build-and-push:
    needs: build-builder
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: block-indexer
            title: Union Client Block Indexer
            description: Union Bridge Client Block Indexer Service
          - name: log-indexer
            title: Union Client Log Indexer
            description: Union Bridge Client Log Indexer Service
          - name: coordinator
            title: Union Client Coordinator
            description: Union Bridge Client Coordinator Service
          - name: user-api
            title: Union Client User API
            description: Union Bridge Client User API Service
        features:
          - variant: prod
            cargo_features: ""
            suffix: ""
          - variant: anvil
            cargo_features: anvil
            suffix: "-anvil"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.crate.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag,suffix=${{ matrix.features.suffix }}
          labels: |
            org.opencontainers.image.title=${{ matrix.crate.title }}
            org.opencontainers.image.description=${{ matrix.crate.description }}
            org.opencontainers.image.vendor=RSK

      - name: Build and push ${{ matrix.crate.name }} (${{ matrix.features.variant }})
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./docker/build/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.crate.name }}-${{ matrix.features.variant }}
          cache-to: type=gha,mode=min,scope=${{ matrix.crate.name }}-${{ matrix.features.variant }}
          build-args: |
            CRATE=${{ matrix.crate.name }}
            FEATURES=${{ matrix.features.cargo_features }}
            BUILDER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-builder:${{ github.ref_name }}

      - name: Clean up
        if: always()
        run: |
          docker buildx prune -af
          docker system prune -af --volumes
          df -h
