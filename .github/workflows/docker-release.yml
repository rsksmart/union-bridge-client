name: Build and Push Docker Images on Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tag:
        description: 'Tag to use for Docker images'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: rsksmart/union-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git describe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-block-indexer
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-log-indexer
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-coordinator
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-user-api
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Configure Git for private repositories
        run: |
          git config --global \
            url."https://${{ secrets.FAIRGATE_GITHUB_TOKEN }}@github.com/FairgateLabs".insteadOf \
            "ssh://git@github.com/FairgateLabs"
          git config --global \
            url."https://${{ secrets.UNION_CONTRACTS_GITHUB_TOKEN }}@github.com/temp-rsk".insteadOf \
            "ssh://git@github.com/temp-rsk"

      - name: Build and push block-indexer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.github-actions
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-block-indexer:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CRATE=block-indexer
            FAIRGATE_GITHUB_TOKEN=${{ secrets.FAIRGATE_GITHUB_TOKEN }}
            UNION_CONTRACTS_GITHUB_TOKEN=${{ secrets.UNION_CONTRACTS_GITHUB_TOKEN }}

      - name: Build and push log-indexer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.github-actions
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-log-indexer:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CRATE=log-indexer
            FAIRGATE_GITHUB_TOKEN=${{ secrets.FAIRGATE_GITHUB_TOKEN }}
            UNION_CONTRACTS_GITHUB_TOKEN=${{ secrets.UNION_CONTRACTS_GITHUB_TOKEN }}

      - name: Build and push coordinator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.github-actions
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-coordinator:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CRATE=coordinator
            FAIRGATE_GITHUB_TOKEN=${{ secrets.FAIRGATE_GITHUB_TOKEN }}
            UNION_CONTRACTS_GITHUB_TOKEN=${{ secrets.UNION_CONTRACTS_GITHUB_TOKEN }}

      - name: Build and push user-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.github-actions
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-user-api:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CRATE=user-api
            FAIRGATE_GITHUB_TOKEN=${{ secrets.FAIRGATE_GITHUB_TOKEN }}
            UNION_CONTRACTS_GITHUB_TOKEN=${{ secrets.UNION_CONTRACTS_GITHUB_TOKEN }}

      - name: Update latest tags
        if: github.ref_name != 'latest'
        run: |
          # Tag and push latest versions
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-block-indexer:${{ github.ref_name }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-block-indexer:${{ github.ref_name }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-block-indexer:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-block-indexer:latest
          
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-log-indexer:${{ github.ref_name }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-log-indexer:${{ github.ref_name }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-log-indexer:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-log-indexer:latest
          
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-coordinator:${{ github.ref_name }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-coordinator:${{ github.ref_name }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-coordinator:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-coordinator:latest
          
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-user-api:${{ github.ref_name }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-user-api:${{ github.ref_name }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-user-api:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-user-api:latest

      - name: Summary
        run: |
          echo "✅ Successfully built and pushed Docker images:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-block-indexer:${{ github.ref_name }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-log-indexer:${{ github.ref_name }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-coordinator:${{ github.ref_name }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-user-api:${{ github.ref_name }}"
          echo ""
          echo "🔗 View images at: https://github.com/${{ github.repository }}/pkgs/container/union-client-block-indexer"