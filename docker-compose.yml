# define base configuration for services
x-base-service: &base-service
  build: &base-build
    context: .
    dockerfile: Dockerfile
    ssh:
      - default=${SSH_AUTH_SOCK}
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG=debug
  restart: unless-stopped
  volumes:
    - ./config/docker:/app/config/docker:ro
    - ./log4rs.yaml:/app/log4rs.yaml:ro
  # healthcheck base configuration
  healthcheck: &base-healthcheck
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  block-indexer:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=block-indexer
    container_name: block-indexer
    volumes:
      - ./.db/docker/block-indexer:/app/db/block-indexer
    # expose the broker port
    ports:
      - "12345:12345"  # broker server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.10
    # healthcheck to ensure the service is running properly
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "block-indexer" ]
    entrypoint: ["/app/block-indexer", "--config-path", "/app/config/docker"]


  log-indexer:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=log-indexer
    container_name: log-indexer
    volumes:
      - ./.db/docker/log-indexer:/app/db/log-indexer
    # expose the broker port
    ports:
      - "56789:56789"  # broker server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.11
    # healthcheck to ensure the service is running properly
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "log-indexer" ]
    entrypoint: ["/app/log-indexer", "--config-path", "/app/config/docker"]

  transaction-dispatcher:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=transaction-dispatcher
    container_name: transaction-dispatcher
    volumes:
      - ./.db/docker/transaction-dispatcher:/app/db/transaction-dispatcher
      - "${HOST_KEY_STORE_PATH}:/keystore/key.json:ro" # mount local keystore into container
    # expose the http port
    ports:
      - "3000:3000"  # http server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.12
    # env vars for keystore access
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
    # healthcheck to ensure the service is running properly
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "transaction-dispatcher" ]
    entrypoint:
      - /bin/sh
      - -c
      - exec /app/transaction-dispatcher --config-path /app/config/docker

  coordinator:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=coordinator
    container_name: coordinator
    volumes:
      - ./.db/docker/coordinator:/app/db/coordinator
    # healthcheck to ensure the service is running properly
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "coordinator" ]
    networks:
      internal:
        ipv4_address: 172.25.0.13
    entrypoint: ["/app/coordinator", "--config-path", "/app/config/docker"]

