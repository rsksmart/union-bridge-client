[package]
name = "qa-tools-bitvmx-mock"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
# Main workspace dependencies
common = { path = "../../common" }
transaction-dispatcher = { path = "../../transaction-dispatcher" }

# QA tools dependencies
qa-tools-common = { path = "../common" }

# External dependencies
anyhow = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
bitcoin = "^0.32.5"
uuid = "1.10.0"
hex = "0.4"
clap = { workspace = true }  # For CLI parsing
env_logger = "0.11"         # Fallback logger  
log4rs = "1.3"              # Primary logger
warp = "0.3"                # Simple HTTP server
reqwest = { version = "0.12", features = ["json"] }
tokio-util = "0.7.15"  # HTTP client
