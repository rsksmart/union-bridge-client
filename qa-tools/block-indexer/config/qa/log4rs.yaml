refresh_rate: 30 seconds

appenders:
  rolling_file:
    kind: rolling_file
    path: "{DESTINATION}/{CRATE_NAME}/app.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S%.3f)} {l:>5} {m}{n}"
    policy:
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{DESTINATION}/{CRATE_NAME}/app.{}.log"

root:
  level: debug
  appenders:
    - rolling_file