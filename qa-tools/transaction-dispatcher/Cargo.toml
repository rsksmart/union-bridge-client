[package]
name = "qa-tools-transaction-dispatcher"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
# Dependencies from the main repository
transaction-dispatcher = { path = "../../transaction-dispatcher" }
common = { path = "../../common" }

# Dependencies from the qa-tools workspace
qa-tools-common = { path = "../common" }

# Other dependencies
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
log4rs = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"]  }
cucumber = { workspace = true, features = ["output-junit", "tracing"] }
reqwest = { workspace = true }
rand = "0.9.1"
hex = "0.4"
sha2 = "0.10.9"
bitcoin = "^0.32.5"
byteorder = "1.5.0"
once_cell = "1.21.3"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0.12"
lazy_static = "1.5.0"