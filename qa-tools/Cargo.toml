[workspace]
resolver = "2"
members = ["common", "block-indexer", "log-indexer", "transaction-dispatcher", "check-fork"]

[workspace.dependencies]
# Dependencies from the main workspace that qa-tools needs
anyhow = "1.0.94"
clap = "4.5.30"
log = "0.4.22"
log4rs = "1.3.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.16.0"
tokio = { version = "1.41.1", features = ["rt-multi-thread", "macros"] }

# External dependencies specific to qa-tools
regex = "1.7"
serde_yaml = "0.9"
tungstenite = "0.26.2"
url = "2.3"
chrono = "0.4.40"
ethers-core = "2.0.14"
ethers-signers = "2.0.14"
ethers-middleware = "2.0.14"
ethers-providers = "2.0.14"
ethers-contract = "2.0.14"

