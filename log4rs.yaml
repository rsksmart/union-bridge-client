refresh_rate: 30 seconds

appenders:
  rolling_file:
    kind: rolling_file
    path: "{DESTINATION}/{CRATE_NAME}-{CLIENT_ID}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S%.3f)} [{l:>5}] [{M}] {m}{n}"
    policy:
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{DESTINATION}/{CRATE_NAME}-{CLIENT_ID}.{}.log"

root:
  level: debug
  appenders:
    - rolling_file

loggers:
  tarpc: # from bitvmx-broker
    level: warn
  alloy_provider:
    level: warn
  alloy_pubsub:
    level: warn
  alloy_rpc_client:
    level: warn
  alloy_json_rpc:
    level: warn
