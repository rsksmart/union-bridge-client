[workspace]
resolver = "2"
members = ["bitcoin-wallet", "operations", "run"]

[workspace.package]
version = "0.4.0"
license = "MIT"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# pedantic is allowed here: cli is operator/developer tooling, not the production peg pipeline.
pedantic = { level = "allow", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple-crate-versions = "allow"
cargo-common-metadata = "allow"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.dependencies]
alloy-primitives = "1.4.1"
anyhow = "1.0.102"
bitcoin = { version = "=0.32.6", features = ["std", "rand-std", "serde"] }
clap = { version = "4.5.61", features = ["derive"] }
hex = "0.4.3"
key-manager = { path = "../key-manager" }
nix = { version = "0.29.0", features = ["signal", "process"] }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
rpassword = "7.3.1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[workspace.dependencies.tokio]
version = "1.47.1"
features = ["rt-multi-thread", "macros", "signal", "sync", "time"]
