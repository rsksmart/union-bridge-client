[workspace]
resolver = "2"
members = ["run", "operations", "bitcoin-wallet"]

[workspace.package]
version = "0.4.0"
license = "MIT"

[workspace.dependencies]
alloy-primitives = "1.4.1"
anyhow = "1.0.102"
bitcoin = { version = "=0.32.6", features = ["std", "rand-std", "serde"] }
clap = { version = "4.5.61", features = ["derive"] }
nix = { version = "0.29.0", features = ["signal", "process"] }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rpassword = "7.5.0"
key-manager = { path = "../key-manager" }
tempfile = "3.16.0"

[workspace.dependencies.tokio]
version = "1.47.1"
features = ["rt-multi-thread", "macros", "signal", "sync", "time"]
