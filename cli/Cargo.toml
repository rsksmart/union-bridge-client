[workspace]
resolver = "2"
members = ["run", "operations", "bitcoin-wallet", "mocks"]

[workspace.package]
version = "0.3.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
nix = { version = "0.29.0", features = ["signal", "process"] }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rpassword = "7.3.1"
key-manager = { path = "../key-manager" }

[workspace.dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "signal", "sync", "time"]
