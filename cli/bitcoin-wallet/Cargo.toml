[package]
name = "ub-wallet"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.13.1"
bitcoin = { version = "0.32.6", features = ["std", "rand-std", "serde"] }
bitcoincore-rpc = "0.18.0"
bollard = "0.11.1"
chrono = { version = "0.4.44", features = ["clock"] }
clap = { version = "4.5.61", features = ["derive", "env"] }
futures-util = "0.3.32"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls", "blocking"] }
rustyline = "12.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
storage-backend = { package = "rust-bitvmx-storage-backend", git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", rev = "16a01bfe316266bdac080828e260cd191fcb3cde" }
tokio = { version = "1.47.1", features = ["sync"] }
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.16.0"

[lints]
workspace = true
