[package]
name = "user-api"
version.workspace = true
license.workspace = true
rust-version.workspace = true
edition = "2021"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bitcoin = { workspace = true, features = ["std", "rand-std", "serde"] }
clap = { workspace = true }
common = { path = "../common" }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true }
tracing = { workspace = true }
transaction-dispatcher = { path = "../transaction-dispatcher", features = ["types"] }
uuid = { workspace = true }

[lints.clippy]
all = "allow" # non-production code, do not require strict linting
