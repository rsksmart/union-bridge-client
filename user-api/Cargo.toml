[package]
name = "user-api"
version = "0.1.0"
edition = "2021"

[lints.clippy]
all = "allow" # non-production code, do not require strict linting

[dependencies]
axum = { workspace = true }
bitcoin = { workspace = true, features = ["std", "rand-std", "serde"] }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
common = { path = "../common" }
transaction-dispatcher = { path = "../transaction-dispatcher", features = ["types"] }
serde = { version = "1.0.219", features = ["derive"] }
hex = "0.4.3"

