[package]
name = "transaction-dispatcher"
version.workspace = true
license.workspace = true
rust-version.workspace = true
edition = "2024"

[features]
default = ["types"]
types = []

[dependencies]

alloy-contract = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true, features = ["ws"] }
alloy-rpc-types = { workspace = true, features = ["debug"] }
alloy-sol-types = { workspace = true, features = ["json"] }
alloy-transport = { workspace = true }
anyhow = { workspace = true }
bitcoin = { workspace = true }
common-bitvmx = { path = "../common/bitvmx" }
common-core = { path = "../common/core" }
common-runtime = { path = "../common/runtime" }
hex = { workspace = true, features = ["serde"] }
key-manager = { path = "../key-manager" }
multiaddr = "0.18.2"
musig2 = { workspace = true }
primitive-types = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
union-contracts = { workspace = true }

[dev-dependencies]
mockall = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
