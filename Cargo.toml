[workspace]
resolver = "2"
members = ["common", "block-indexer", "log-indexer", "transaction-dispatcher", "key-manager", "check-fork", "check-fork/zkp", "coordinator", "actors-mocking"]

[workspace.dependencies]
# alloy-rs-core
alloy-dyn-abi = "1.2.1"
alloy-json-abi = "1.2.1"
alloy-primitives = "1.2.1"
alloy-sol-types = "1.2.1"
# alloy
alloy-contract = "1.0.12"
alloy-json-rpc = "1.0.12"
alloy-provider = "1.0.12"
alloy-pubsub = "1.0.12"
alloy-rpc-client = "1.0.12"
alloy-rpc-types = "1.0.12"
alloy-signer = "1.0.12"
alloy-signer-local = { version = "1.0.12" }
alloy-transport = "1.0.12"
#
anyhow = "1.0.94"
bincode = { version = "2.0.1", features = ["serde"] }
clap = "4.5.30"
hex = "0.4.3"
log = "0.4.22"
log4rs = "1.3.0"
mockall = "0.13.1"
primitive-types = { version = "0.13.1", features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.11"
tokio = { version = "1.41.1" }
config = "0.15.8"
storage-backend = { package = "rust-bitvmx-storage-backend", git = "ssh://git@github.com/FairgateLabs/rust-bitvmx-storage-backend.git", rev = "7f40d056f86295e3fd2a4f268f923ca3b4e70fbf" }
union-contracts = { package = "union-bridge-contracts", git = "ssh://git@github.com/FairgateLabs/bitvmx-union-bridge-contracts.git", tag = "v0.0.1-alpha.2" }
message-broker = { package = "bitvmx-broker", git = "ssh://git@github.com/FairgateLabs/rust-bitvmx-broker.git", rev = "98e9b43bdac2a02d6313767a0f2607b7e8f8da5e" }
# TODO(jira) https://rsklabs.atlassian.net/browse/ub-176
bitvmx-client = { path = "../rust-bitvmx-workspace/rust-bitvmx-client" }

#dev-dependencies
tempfile = "3.16.0"
env_logger = "0.11.6"
