[workspace]
resolver = "2"
members = ["qa-tools/block-indexer-validator", "common", "rsk-provider", "block-indexer", "log-indexer", "transaction-dispatcher", "test-utils", "key-manager"]

[workspace.dependencies]
alloy-primitives = "0.8.22"
alloy-sol-types = "0.8.21"
alloy-provider = { version = "0.12.5" }
anyhow = "1.0.94"
clap = "4.5.30"
hex = "0.4.3"
log = "0.4.22"
log4rs = "1.3.0"
mockall = "0.13.1"
primitive-types = { version = "0.13.1", features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.11"
tokio = { version = "1.41.1" }
alloy-rpc-types = "0.12.5"
storage-backend = { package = "rust-bitvmx-storage-backend", git = "ssh://git@github.com/FairgateLabs/rust-bitvmx-storage-backend.git", rev = "7f40d056f86295e3fd2a4f268f923ca3b4e70fbf" }

#dev-dependencies
tempfile = "3.16.0"
env_logger = "0.11.6"
