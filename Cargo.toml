[workspace]
resolver = "2"
members = [
    "block-indexer",
    "check-fork",
    "check-fork/tester",
    "check-fork/zkp",
    "common",
    "coordinator",
    "key-manager",
    "log-indexer",
    "transaction-dispatcher",
    "user-api",
]

[workspace.package]
version = "0.2.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple-crate-versions = "allow"
cargo-common-metadata = "allow"

[workspace.dependencies]
# alloy
alloy-contract = "1.0.37"
# alloy-rs-core
alloy-dyn-abi = "1.4.0"
alloy-json-abi = "1.4.0"
alloy-json-rpc = "1.0.37"
alloy-primitives = "1.4.0"
alloy-provider = "1.0.37"
alloy-pubsub = "1.0.37"
alloy-rpc-client = "1.0.37"
alloy-rpc-types = "1.0.37"
alloy-signer = "1.0.37"
alloy-signer-local = { version = "1.0.37" }
alloy-sol-types = "1.4.0"
alloy-transport = "1.0.37"
#
anyhow = "1.0.94"
axum = "0.8.1"
bincode = { version = "2.0.1", features = ["serde"] }
bitcoin = { version = "0.32.6", features = ["std", "rand-std", "serde"] }
clap = "4.5.30"
config = "0.15.8"
env_logger = "0.11.6"
hex = "0.4.3"
log = "0.4.22"
log4rs = "1.3.0"
message-broker = { package = "bitvmx-broker", git = "ssh://git@github.com/FairgateLabs/rust-bitvmx-broker.git", branch = "v.0.0.2" }
mockall = "0.13.1"
musig2 = { version = "0.2.3", features = ["serde", "rand"] }
primitive-types = { version = "0.13.1", features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.33"
sha2 = "0.10.9"
storage-backend = { package = "rust-bitvmx-storage-backend", git = "ssh://git@github.com/FairgateLabs/rust-bitvmx-storage-backend.git", rev = "16a01bfe316266bdac080828e260cd191fcb3cde" }

#dev-dependencies
tempfile = "3.16.0"
thiserror = "2.0.11"
tiny-keccak = "2.0.2"
tokio = { version = "1.41.1" }
tower-http = { version = "0.6.1", features = ["timeout", "trace"] }
union-contracts = { package = "union-bridge-contracts", git = "ssh://git@github.com/temp-rsk/bitvmx-union-bridge-contracts.git", tag = "v0.2.0-alpha" }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
