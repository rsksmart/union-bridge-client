#####################################################################################################################################
# INTEGRATED DOCKER COMPOSE: BitVMX + Union Bridge Client
#####################################################################################################################################

services:
  # ================================
  # BitVMX Services
  # ================================
  bitvmx-client:
    platform: linux/amd64
    # environment:
      # RUST_LOG: debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BITVMX_CONFIG_DIR}:/app/config
      - db-bitvmx:/tmp
      - ${RESOURCES_DIR:-../../resources}:/app/resources:ro
    extends:
      file: ../bitvmx-client/docker-compose.yml
      service: bitvmx-client

  # ================================
  # Union Bridge Client Services
  # ================================
  # Operator-specific broker mounts and runtime env vars live here instead of
  # ../build/docker-compose.yml so the base compose remains build-safe.
  block-indexer:
    extends:
      file: ../build/docker-compose.yml
      service: block-indexer
    volumes:
      - ${BLOCK_INDEXER_BROKER_PEM_PATH}:/app/broker.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - union-network

  log-indexer:
    extends:
      file: ../build/docker-compose.yml
      service: log-indexer
    volumes:
      - ${LOG_INDEXER_BROKER_PEM_PATH}:/app/broker.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - union-network

  user-api:
    extends:
      file: ../build/docker-compose.yml
      service: user-api
    volumes:
      - ${USER_API_BROKER_PEM_PATH}:/app/broker.pem:ro
    environment:
      - UB__USER_API__COORDINATOR__PUBKEY_HASH=${UB__USER_API__COORDINATOR__PUBKEY_HASH:-}
      - USER_BITCOIN_WIF=${USER_BITCOIN_WIF:-}
    ports:
      - "${USER_API_PORT:-40001}:40001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - union-network

  coordinator:
    extends:
      file: ../build/docker-compose.yml
      service: coordinator
    volumes:
      - ${COORDINATOR_BROKER_PEM_PATH}:/app/broker.pem:ro
    environment:
      - UB__COORDINATOR__BITVMX__HOST=${BITVMX_HOST:-dummy-bitvmx-host}
      - UB__COORDINATOR__BITVMX__PORT=${UB__COORDINATOR__BITVMX__PORT:-dummy-bitvmx-port}
      - UB__COORDINATOR__BLOCKS__PUBKEY_HASH=${UB__COORDINATOR__BLOCKS__PUBKEY_HASH:-}
      - UB__COORDINATOR__LOGS__PUBKEY_HASH=${UB__COORDINATOR__LOGS__PUBKEY_HASH:-}
      - UB__COORDINATOR__USER__PUBKEY_HASH=${UB__COORDINATOR__USER__PUBKEY_HASH:-}
      - UB__COORDINATOR__BITVMX__PUBKEY_HASH=${UB__COORDINATOR__BITVMX__PUBKEY_HASH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bitvmx-client:
        condition: service_healthy
    networks:
      union-network:

# ================================
# Networks and Volumes
# ================================
networks:
  union-network:
    driver: bridge

volumes:
  keystore:
  db-blocks:
  db-logs:
  db-coordinator:
  db-bitvmx:
