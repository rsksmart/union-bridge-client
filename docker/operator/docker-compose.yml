#####################################################################################################################################
# INTEGRATED DOCKER COMPOSE: BitVMX + Union Bridge Client
#####################################################################################################################################

services:
  # ================================
  # BitVMX Services
  # ================================
  bitvmx-client:
    platform: linux/amd64
    # environment:
      # RUST_LOG: debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    extends:
      file: ../bitvmx-client/docker-compose.yml
      service: bitvmx-client

  # ================================
  # Union Bridge Client Services
  # ================================
  block-indexer:
    extends:
      file: ../build/docker-compose.yml
      service: block-indexer
    networks:
      - union-network

  log-indexer:
    extends:
      file: ../build/docker-compose.yml
      service: log-indexer
    networks:
      - union-network

  user-api:
    extends:
      file: ../build/docker-compose.yml
      service: user-api
    networks:
      - union-network

  coordinator:
    extends:
      file: ../build/docker-compose.yml
      service: coordinator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bitvmx-client:
        condition: service_healthy
    networks:
      union-network:

# ================================
# Networks and Volumes
# ================================
networks:
  union-network:
    driver: bridge

volumes:
  keystore:
  db-blocks:
  db-logs:
  db-coordinator:
  db-bitvmx: