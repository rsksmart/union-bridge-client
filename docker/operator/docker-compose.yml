#####################################################################################################################################
# INTEGRATED DOCKER COMPOSE: BitVMX + Union Bridge Client
#####################################################################################################################################

services:
  # ================================
  # BitVMX Services
  # ================================
  bitvmx-client:
    platform: linux/amd64
    # environment:
      # RUST_LOG: debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Startup order only (keystore): block-indexer runs key-setup first and populates
    # broker.key + broker.pubkey_hash in the shared keystore; bitvmx-client entrypoint
    # reads broker.pubkey_hash to patch op_*.yaml. No domain coupling.
    depends_on:
      block-indexer:
        condition: service_healthy
    volumes:
      - ../bitvmx-client/config/${ENVIRONMENT:-local}/client/config:/app/config
      - db-bitvmx:/tmp
      - ../../resources:/app/resources:ro
      - keystore:/keystore:ro
      - ./patch_bitvmx_op_pubkey_hash.sh:/app/patch_bitvmx_op_pubkey_hash.sh:ro
    entrypoint: ["sh", "-c", "set -e; sh /app/patch_bitvmx_op_pubkey_hash.sh; exec ./run.sh"]
    extends:
      file: ../bitvmx-client/docker-compose.yml
      service: bitvmx-client

  # ================================
  # Union Bridge Client Services
  # ================================
  block-indexer:
    extends:
      file: ../build/docker-compose.yml
      service: block-indexer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - db-blocks:/app/db/blocks
    networks:
      - union-network

  log-indexer:
    extends:
      file: ../build/docker-compose.yml
      service: log-indexer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - db-logs:/app/db/logs
    networks:
      - union-network

  user-api:
    extends:
      file: ../build/docker-compose.yml
      service: user-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - keystore:/keystore
    networks:
      - union-network

  coordinator:
    extends:
      file: ../build/docker-compose.yml
      service: coordinator
    volumes:
      # Override volume mount to ensure config directory is accessible
      # Uses ${CONFIG_DIR} environment variable set by start_operators.sh
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - keystore:/keystore
      - db-coordinator:/app/db/coordinator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bitvmx-client:
        condition: service_healthy
    networks:
      union-network:

# ================================
# Networks and Volumes
# ================================
networks:
  union-network:
    driver: bridge

volumes:
  keystore:
  db-blocks:
  db-logs:
  db-coordinator:
  db-bitvmx:
