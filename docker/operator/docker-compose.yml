#####################################################################################################################################
# INTEGRATED DOCKER COMPOSE: BitVMX + Union Bridge Client
#####################################################################################################################################

services:
  # ================================
  # BitVMX Services
  # ================================
  bitvmx-client:
    environment:
      RUST_LOG: info,bitvmx_client=debug,bitcoin_coordinator=info,bitcoin_indexer=warn,bitcoincore_rpc=warn,hyper=warn,hyper_util=warn,tarpc=warn,bitvmx_bitcoin_rpc=info,bitvmx_transaction_monitor=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BITVMX_CONFIG_DIR}:/app/config
      - db-bitvmx:/tmp
      - ${RESOURCES_DIR:-../../resources}:/app/resources:ro
    extends:
      file: ../bitvmx-client/docker-compose.yml
      service: bitvmx-client

  # ================================
  # Union Bridge Client Services
  # ================================
  # Operator-specific broker mounts and runtime env vars live here instead of
  # ../build/docker-compose.yml so the base compose remains build-safe.
  block-indexer:
    extends:
      file: ../build/docker-compose.yml
      service: block-indexer
    volumes:
      - ${BLOCK_INDEXER_BROKER_PEM_PATH}:/app/broker.pem:ro
    environment:
      - UB__BLOCK_INDEXER__COORDINATOR__CLIENT_ID
      - UB__BLOCK_INDEXER__COORDINATOR__PUBKEY_HASH
      - CLIENT_OP
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - union-network
    logging:
      driver: loki
      options:
        loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
        env: "CLIENT_OP"
        keep-file: "true"

  log-indexer:
    extends:
      file: ../build/docker-compose.yml
      service: log-indexer
    volumes:
      - ${LOG_INDEXER_BROKER_PEM_PATH}:/app/broker.pem:ro
    environment:
      - UB__LOG_INDEXER__COORDINATOR__CLIENT_ID
      - UB__LOG_INDEXER__COORDINATOR__PUBKEY_HASH
      - CLIENT_OP
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - union-network
    logging:
      driver: loki
      options:
        loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
        env: "CLIENT_OP"
        keep-file: "true"

  user-api:
    extends:
      file: ../build/docker-compose.yml
      service: user-api
    volumes:
      - ${USER_API_BROKER_PEM_PATH}:/app/broker.pem:ro
    environment:
      - UB__USER_API__COORDINATOR__CLIENT_ID
      - UB__USER_API__COORDINATOR__PUBKEY_HASH
      - CLIENT_OP
    ports:
      - "${USER_API_PORT:-40001}:40001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - union-network
    logging:
      driver: loki
      options:
        loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
        env: "CLIENT_OP"
        keep-file: "true"

  coordinator:
    extends:
      file: ../build/docker-compose.yml
      service: coordinator
    volumes:
      - ${COORDINATOR_BROKER_PEM_PATH}:/app/broker.pem:ro
    environment:
      - UB__COORDINATOR__BROKER__CLIENT_ID
      - UB__COORDINATOR__BITVMX__HOST=${BITVMX_HOST:-dummy-bitvmx-host}
      - UB__COORDINATOR__BITVMX__PORT
      - UB__COORDINATOR__BLOCKS__PUBKEY_HASH
      - UB__COORDINATOR__LOGS__PUBKEY_HASH
      - UB__COORDINATOR__USER__PUBKEY_HASH
      - UB__COORDINATOR__BITVMX__PUBKEY_HASH
      - CLIENT_OP
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bitvmx-client:
        condition: service_healthy
    networks:
      union-network:
    logging:
      driver: loki
      options:
        loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
        env: "CLIENT_OP"
        keep-file: "true"

# ================================
# Networks and Volumes
# ================================
networks:
  union-network:
    driver: bridge

volumes:
  db-blocks:
  db-block-broker:
  db-logs:
  db-log-broker:
  db-coordinator:
  db-bitvmx:
