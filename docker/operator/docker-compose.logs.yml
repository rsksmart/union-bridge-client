#####################################################################################################################################
# OPT-IN: PERSIST LOGS TO HOST FILES
#
# Layer this file on top of the operator stack to also write each service's logs
# to a host directory (${LOG_DIR}, default ./logs), while keeping stdout exactly
# as before. Enable it with `start-operators.sh --logs`.
#
# Without this override the stack behaves exactly as before: the union-client
# services still log to stdout (and to an ephemeral /app/logs inside the
# container), and bitvmx-client logs only to stdout.
#
# All services in one operator stack share the same per-operator host directory;
# filenames differ per service (e.g. coordinator.log, bitvmx-client.log).
#####################################################################################################################################

services:
  bitvmx-client:
    # Wrap run.sh in a shell so its stdout/stderr can be tee'd to a host-mounted
    # log file while still being emitted to the container's stdout (docker logs).
    # Each operator has its own ${LOG_DIR}, so a plain filename is unambiguous.
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "./run.sh 2>&1 | tee -a /app/logs/bitvmx-client.log" ]
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs

  # The union-client services already write tracing output to /app/logs
  # (UB_LOG_DIR=/app/logs); this just persists that directory onto the host.
  block-indexer:
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs

  log-indexer:
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs

  user-api:
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs

  coordinator:
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs
