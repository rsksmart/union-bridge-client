# define base configuration for services
x-base-service: &base-service
  build: &base-build
    context: ../
    dockerfile: docker/Dockerfile
    ssh:
      - default=${SSH_AUTH_SOCK}
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG=debug
  restart: no
  # healthcheck base configuration
  healthcheck: &base-healthcheck
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  block-indexer:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=block-indexer
    container_name: block-indexer
    volumes:
      - ../config/docker/common.yaml:/app/config/common.yaml:ro
      - ../config/docker/block-indexer.yaml:/app/config/block-indexer.yaml:ro
      - ./log4rs.yaml:/app/log4rs.yaml:ro
      - ./.db/block-indexer:/app/db/blocks
    ports:
      - "12345:12345"  # broker server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.10
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD-SHELL", "pgrep block-indexer" ] # TODO improve with health endpoint
    entrypoint: [ "/app/block-indexer", "--config-path", "/app/config" ]
    depends_on:
      actors-mocking:
        condition: service_healthy

  log-indexer:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=log-indexer
    container_name: log-indexer
    volumes:
      - ../config/docker/common.yaml:/app/config/common.yaml:ro
      - ../config/docker/log-indexer.yaml:/app/config/log-indexer.yaml:ro
      - ./log4rs.yaml:/app/log4rs.yaml:ro
      - ./.db/log-indexer:/app/db/logs
    ports:
      - "56789:56789"  # broker server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.11
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD-SHELL", "pgrep log-indexer" ] # TODO improve with health endpoint
    entrypoint: [ "/app/log-indexer", "--config-path", "/app/config" ]
    depends_on:
      actors-mocking:
        condition: service_healthy

  transaction-dispatcher:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=transaction-dispatcher
        - FOUNDRY_VERSION=${FOUNDRY_VERSION}
    container_name: transaction-dispatcher
    volumes:
      - ../config/docker/common.yaml:/app/config/common.yaml:ro
      - ../config/docker/transaction-dispatcher.yaml:/app/config/transaction-dispatcher.yaml:ro
      - ./log4rs.yaml:/app/log4rs.yaml:ro
      - ./entrypoint-tx-dispatcher.sh:/app/entrypoint-tx-dispatcher.sh:ro
    ports:
      - "3000:3000"  # http server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.12
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - FUNDING_ADDRESS=${FUNDING_ADDRESS}
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "transaction-dispatcher" ]
    entrypoint: [ "sh", "/app/entrypoint-tx-dispatcher.sh" ]
    depends_on:
      actors-mocking:
        condition: service_healthy

  coordinator:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=coordinator
    container_name: coordinator
    volumes:
      - ../config/docker/common.yaml:/app/config/common.yaml:ro
      - ../config/docker/coordinator.yaml:/app/config/coordinator.yaml:ro
      - ./log4rs.yaml:/app/log4rs.yaml:ro
    networks:
      internal:
        ipv4_address: 172.25.0.13
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "coordinator" ]
    entrypoint: [ "/app/coordinator", "--config-path", "/app/config" ]
    depends_on:
      - log-indexer
      - block-indexer

  actors-mocking:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=actors-mocking
        - FOUNDRY_VERSION=${FOUNDRY_VERSION}
        - UNION_CONTRACTS_TAG=${UNION_CONTRACTS_TAG}
    stdin_open: true   # for CLI
    tty: true          # for CLI
    container_name: actors-mocking
    volumes:
      - ./entrypoint-sc-ev-mock.sh:/app/entrypoint-sc-ev-mock.sh:ro
    ports:
      - "2222:2222"  # anvil port, hardcoded in crate
    networks:
      internal:
        ipv4_address: 172.25.0.14
    environment:
      - UNION_CONTRACTS_DEPLOY_SCRIPT=/app/contracts/shell/script/deploy/deploy-local.sh
      - CHECK_FORK_REQUIRED_NUM_BLOCKS=${CHECK_FORK_REQUIRED_NUM_BLOCKS}
    healthcheck:
      <<: *base-healthcheck
      test: [
        "CMD-SHELL",
        "RUST_LOG=error cast code 0xa513E6E4b8f2a923D98304ec87F64353C4D5C853 --rpc-url http://localhost:2222 | grep -vq '^0x$'" # PegManager contract address should match config and deployed address
      ]
    entrypoint: [ "/app/actors-mocking" ]
    # entrypoint: [ "/bin/sh", "-c", "sleep infinity" ]

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
