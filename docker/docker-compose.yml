#####################################################################################################################################
# DISCLAIMER: This docker-compose file is intended for development and testing purposes only, not for production use. ###############
#####################################################################################################################################

# define common config
x-common-config: &common-config
                   ../config/docker:/app/config:ro
x-log-config: &log-config
                ./log4rs.yaml:/app/log4rs.yaml:ro

# define base configuration for services
x-base-service: &base-service
  build: &base-build
    context: ../
    dockerfile: docker/Dockerfile
    ssh:
      - default=${SSH_AUTH_SOCK}
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG=debug
  volumes:
    - *common-config
    - *log-config
  restart: no
  # healthcheck base configuration
  healthcheck: &base-healthcheck
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  block-indexer:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=block-indexer
    container_name: block-indexer
    volumes:
      - *common-config
      - *log-config
      - ./.db/block-indexer:/app/db/blocks
    ports:
      - "12345:12345"  # broker server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.10
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "pgrep", "-f", "block-indexer" ] # TODO improve with health endpoint
    entrypoint: [ "/app/block-indexer", "--config-path", "/app/config" ]
    depends_on:
      actors-mocking:
        condition: service_healthy

  log-indexer:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=log-indexer
    container_name: log-indexer
    volumes:
      - *common-config
      - *log-config
      - ./.db/log-indexer:/app/db/logs
    ports:
      - "56789:56789"  # broker server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.11
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "pgrep", "-f", "log-indexer" ] # TODO improve with health endpoint
    entrypoint: [ "/app/log-indexer", "--config-path", "/app/config" ]
    depends_on:
      actors-mocking:
        condition: service_healthy

  transaction-dispatcher:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=transaction-dispatcher
        - FOUNDRY_VERSION=${FOUNDRY_VERSION}
    container_name: transaction-dispatcher
    volumes:
      - *common-config
      - *log-config
      - ./entrypoint_sh/key-setup.sh:/app/key-setup.sh:ro
      - keystore:/keystore
    ports:
      - "3000:3000"  # http server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.12
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - FUNDING_ADDRESS=${FUNDING_ADDRESS}
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "pgrep", "-f", "transaction-dispatcher" ]
    entrypoint: [ "sh", "/app/key-setup.sh" ]
    command: [ "/app/transaction-dispatcher", "--config-path", "/app/config" ]
    depends_on:
      actors-mocking:
        condition: service_healthy

  coordinator:
    <<: *base-service
    platform: linux/amd64
    build:
      <<: *base-build
      dockerfile: docker/Dockerfile_coordinator # custom Dockerfile, risc0 needs amd64
      args:
        - CRATE=coordinator
    container_name: coordinator
    volumes:
      - *common-config
      - *log-config
      - keystore:/keystore
    networks:
      internal:
        ipv4_address: 172.25.0.13
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "pgrep", "-f", "coordinator" ]
    entrypoint: [ "/app/coordinator", "--config-path", "/app/config" ]
    depends_on:
      block-indexer:
        condition: service_healthy
      log-indexer:
        condition: service_healthy
      transaction-dispatcher:
        condition: service_healthy
      user-api:
        condition: service_healthy

  user-api:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=user-api
    container_name: user-api
    volumes:
      - *common-config
      - *log-config
    ports:
      - "5551:5551"  # http server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.15
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "pgrep", "-f", "user-api" ]
    entrypoint: [ "/app/user-api", "--config-path", "/app/config" ]

  actors-mocking:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=actors-mocking
        - FOUNDRY_VERSION=${FOUNDRY_VERSION}
        - UNION_CONTRACTS_TAG=${UNION_CONTRACTS_TAG}
    stdin_open: true   # for CLI
    tty: true          # for CLI
    container_name: actors-mocking
    ports:
      - "8545:8545"  # anvil port, hardcoded in crate
    networks:
      internal:
        ipv4_address: 172.25.0.14
    environment:
      - UNION_CONTRACTS_PATH=/app/contracts
      - UNION_CONTRACTS_DEPLOY_SCRIPT=shell/script/deploy/deploy-local.sh
      - UNION_CONTRACTS_SETUP_SCRIPT=shell/script/integration-test/packet-creation-flow.sh
      - CHECK_FORK_REQUIRED_NUM_BLOCKS=${CHECK_FORK_REQUIRED_NUM_BLOCKS}
      - FAKE_PEGMANAGER_CONTRACT_ADDRESS=${FAKE_PEGMANAGER_CONTRACT_ADDRESS}
    healthcheck:
      <<: *base-healthcheck
      test: [
        "CMD-SHELL",
        # check FakePegManager is deployed (it is the last contract deployed)
        "RUST_LOG=error cast code ${FAKE_PEGMANAGER_CONTRACT_ADDRESS} --rpc-url http://localhost:8545 | grep -vq '^0x$'"
      ]
    entrypoint: [ "/app/actors-mocking" ]
    # entrypoint: [ "/bin/sh", "-c", "sleep infinity" ]

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  keystore:
