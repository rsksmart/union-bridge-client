# DISCLAIMER: This docker-compose file is intended for development and testing purposes only, not for production use. ###############
#####################################################################################################################################

services:
  block-indexer:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-block-indexer:${REPO_VERSION:-latest}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - CRATE=block-indexer
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ${CONFIG_PATH:-../config/docker}:/app/config:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - ./.db/${COMPOSE_PROJECT_NAME}/block-indexer:/app/db/blocks
    restart: no
    ports:
      - "12345"  # broker server port from the configuration
    networks:
      union-bridge:
        ipv4_address: 172.25.0.10
    environment:
      - UB__notifier__broker_host=${BLOCK_BROKER_HOST}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: [ "CMD", "pgrep", "-f", "block-indexer" ] # TODO improve with health endpoint
    entrypoint: [ "/app/block-indexer", "--config-path", "/app/config" ]

  log-indexer:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-log-indexer:${REPO_VERSION:-latest}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - CRATE=log-indexer
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ${CONFIG_PATH:-../config/docker}:/app/config:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - ./.db/${COMPOSE_PROJECT_NAME}/log-indexer:/app/db/logs
    restart: no
    ports:
      - "56789"  # broker server port from the configuration
    networks:
      union-bridge:
        ipv4_address: 172.25.0.11
    environment:
      - UB__notifier__broker_host=${LOG_BROKER_HOST}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: [ "CMD", "pgrep", "-f", "log-indexer" ] # TODO improve with health endpoint
    entrypoint: [ "/app/log-indexer", "--config-path", "/app/config" ]

  transaction-dispatcher:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-transaction-dispatcher:${REPO_VERSION:-latest}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - CRATE=transaction-dispatcher
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ${CONFIG_PATH:-../config/docker}:/app/config:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - ./entrypoint_sh/key-setup.sh:/app/key-setup.sh:ro
      - keystore:/keystore
    restart: no
    ports:
      - "3000"  # http server port from the configuration
    networks:
      union-bridge:
        ipv4_address: 172.25.0.12
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: [ "CMD", "pgrep", "-f", "transaction-dispatcher" ]
    entrypoint: [ "sh", "/app/key-setup.sh" ]
    command: [ "/app/transaction-dispatcher", "--config-path", "/app/config" ]

  coordinator:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-coordinator:${REPO_VERSION:-latest}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - CRATE=coordinator
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ${CONFIG_PATH:-../config/docker}:/app/config:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - keystore:/keystore
    restart: no
    networks:
      union-bridge:
        ipv4_address: 172.25.0.13
    environment:
      - UB__bitvmx_broker__ip=${BITVMX_HOST}
      - UB__bitvmx_broker__port=${BITVMX_PORT}
      - UB__block_broker__ip=${BLOCK_BROKER_HOST}
      - UB__log_broker__ip=${LOG_BROKER_HOST}
      - UB__user_broker__ip=${USER_BROKER_HOST}
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: [ "CMD", "pgrep", "-f", "coordinator" ]
    entrypoint: [ "/app/coordinator", "--config-path", "/app/config" ]
    depends_on:
      block-indexer:
        condition: service_healthy
      log-indexer:
        condition: service_healthy
      transaction-dispatcher:
        condition: service_healthy
      user-api:
        condition: service_healthy

  user-api:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-user-api:${REPO_VERSION:-latest}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - CRATE=user-api
      ssh:
        - default=${SSH_AUTH_SOCK}
    volumes:
      - ${CONFIG_PATH:-../config/docker}:/app/config:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
    restart: no
    ports:
      - "5551"  # http server port from the configuration
    networks:
      union-bridge:
        ipv4_address: 172.25.0.15
    environment:
      - UB__block_broker__ip=${USER_BROKER_HOST}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: [ "CMD", "pgrep", "-f", "user-api" ]
    entrypoint: [ "/app/user-api", "--config-path", "/app/config" ]

networks:
  union-bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  keystore:
