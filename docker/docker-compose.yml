#####################################################################################################################################

# define base configuration for services
x-base-service: &base-service
  build: &base-build
    context: ../
    dockerfile: docker/Dockerfile
    ssh:
      - default=${SSH_AUTH_SOCK}
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG=debug
  restart: no
  # healthcheck base configuration
  healthcheck: &base-healthcheck
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  block-indexer:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=block-indexer
    container_name: block-indexer
    volumes:
      - ../config/docker/common.yaml:/app/config/common.yaml:ro
      - ../config/docker/block-indexer.yaml:/app/config/block-indexer.yaml:ro
      - ./log4rs.yaml:/app/log4rs.yaml:ro
      - ../.db/docker/block-indexer:/app/db/block-indexer
    ports:
      - "12345:12345"  # broker server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.10
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "block-indexer" ]
    entrypoint: [ "/app/block-indexer", "--config-path", "/app/config"]
    depends_on:
      - sc-event-mocking

  log-indexer:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=log-indexer
    container_name: log-indexer
    volumes:
      - ../config/docker/common.yaml:/app/config/common.yaml:ro
      - ../config/docker/log-indexer.yaml:/app/config/log-indexer.yaml:ro
      - ./log4rs.yaml:/app/log4rs.yaml:ro
      - ../.db/docker/log-indexer:/app/db/log-indexer
    ports:
      - "56789:56789"  # broker server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.11
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "log-indexer" ]
    entrypoint: [ "/app/log-indexer", "--config-path", "/app/config"]
    depends_on:
      - sc-event-mocking

  transaction-dispatcher:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=transaction-dispatcher
    container_name: transaction-dispatcher
    volumes:
      - ../config/docker/common.yaml:/app/config/common.yaml:ro
      - ../config/docker/transaction-dispatcher.yaml:/app/config/transaction-dispatcher.yaml:ro
      - ./log4rs.yaml:/app/log4rs.yaml:ro
    ports:
      - "3000:3000"  # http server port from the configuration
    networks:
      internal:
        ipv4_address: 172.25.0.12
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "transaction-dispatcher" ]
    entrypoint: [ "/app/transaction-dispatcher", "--config-path", "/app/config"]
    depends_on:
      - sc-event-mocking

  coordinator:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=coordinator
    container_name: coordinator
    volumes:
      - ../config/docker/common.yaml:/app/config/common.yaml:ro
      - ../config/docker/coordinator.yaml:/app/config/coordinator.yaml:ro
      - ./log4rs.yaml:/app/log4rs.yaml:ro
    networks:
      internal:
        ipv4_address: 172.25.0.13
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "coordinator" ]
    entrypoint: [ "/app/coordinator", "--config-path", "/app/config"]
    depends_on:
      - log-indexer
      - block-indexer

  sc-event-mocking:
    <<: *base-service
    build:
      <<: *base-build
      args:
        - CRATE=sc-event-mocking
        - UNION_CONTRACTS_TAG=${UNION_CONTRACTS_TAG}
    stdin_open: true   # for CLI
    tty: true          # for CLI
    container_name: sc-event-mocking
    ports:
      - "2222:2222"  # anvil port, hardcoded in crate
    networks:
      internal:
        ipv4_address: 172.25.0.14
    environment:
      - UNION_CONTRACTS_DEPLOY_SCRIPT=/app/contracts/shell/script/deploy/deploy-local.sh
    healthcheck:
      <<: *base-healthcheck
      test: [ "CMD", "ps", "aux", "|", "grep", "sc-event-mocking" ]
    entrypoint: [ "/app/sc-event-mocking" ]
    # entrypoint: [ "/bin/sh", "-c", "sleep infinity" ]

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
