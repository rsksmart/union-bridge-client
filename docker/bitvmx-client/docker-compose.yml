services:
  bitvmx-client:
    # Published by upstream BitVMX workspace; use the same ref your operators expect. Override via compose if you mirror the image.
    image: ghcr.io/fairgatelabs/rust-bitvmx-workspace/bitvmx-client:v0.5.3-alpha
    # container_name: bitvmx-client-container
    restart: unless-stopped
    entrypoint: [ "./run.sh" ]
    environment:
      RUST_BACKTRACE: full
      CLIENT_OP: ${CLIENT_OP}
      BITCOIND_URL: ${BITCOIND_URL}
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f bitvmx-client" ] # Check bitvmx-client process is running
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - db-bitvmx:/tmp

volumes:
  db-bitvmx:
