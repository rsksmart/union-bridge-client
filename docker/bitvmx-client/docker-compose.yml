services:
  bitvmx-client:
    # Published by the upstream BitVMX client project; override if you mirror the image or need a different ref.
    image: ghcr.io/fairgatelabs/rust-bitvmx-workspace/bitvmx-client:v0.7.2.1
    # container_name: bitvmx-client-container
    restart: unless-stopped
    entrypoint: [ "./run.sh" ]
    environment:
      RUST_BACKTRACE: full
      RUST_LOG: info,bitvmx_client=debug,bitcoin_coordinator=info,bitcoin_indexer=warn,bitcoincore_rpc=warn,hyper=warn,hyper_util=warn,tarpc=warn,bitvmx_bitcoin_rpc=info,bitvmx_transaction_monitor=info
      CLIENT_OP: ${CLIENT_OP}
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f bitvmx-client" ] # Check bitvmx-client process is running
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - db-bitvmx:/tmp
    logging:
      driver: loki
      options:
        loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
        env: "CLIENT_OP"
        keep-file: "true"

volumes:
  db-bitvmx:
