bitcoin:
  network: regtest
  url: http://<bitcoin-user>:<password>@<ip>:<port>
  username: <bitcoin-user>
  password: <password>
  wallet: test_wallet

key_manager:
  network: regtest
  key_derivation_path: m/101/1/0/0/

coordinator_settings:
  max_feerate_sat_vb: 2
  monitor_settings:
    indexer_settings:
      checkpoint_height: 0

key_storage:
  password: PLACEHOLDER_KEY_STORAGE_PASSWORD
  path: /tmp/regtest/op_1/keys.db

storage:
  path: /tmp/regtest/op_1/storage.db

p2p:
  address: /ip4/<p2p-host>/tcp/<p2p-port>
  key: config/keys/op_1.key
  peer_id_file: peer_id
  timeout: 5

coordinator:
  throtthle_bitcoin_updates_until_sync: 0
  throtthle_bitcoin_updates: 0

broker_storage: 
  path: /tmp/regtest/op_1/broker.db

broker_port: 22222

client: 
  # Number of retries for requests
  retry: 1
  # Delay between retries in milliseconds
  retry_delay: 1000

wallet:
  db_path: /tmp/regtest/op_1/wallet.db
  start_height: 0
