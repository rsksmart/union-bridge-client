services:
  bitvmx-client:
    image: ghcr.io/fairgatelabs/rust-bitvmx-workspace/bitvmx-client:v0.1.3-alpha
    container_name: bitvmx-client-container
    restart: unless-stopped
    entrypoint: [ "./run.sh" ]
    environment:
      RUST_BACKTRACE: full
      CLIENT_OP: ${CLIENT_OP}
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f bitvmx-client" ] # Check bitvmx-client proccess is running
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "22222:22222"
    expose:
      - "22222"
    volumes:
      - ./config/client/config:/app/config
      - ./config/broker/config:/app/rust-bitvmx-workspace/rust-fakep2p/broker/config
      - ./volumes/tmp:/tmp
