# 4 BitVMX clients for local development (union-client runs locally with cargo)
# Preferred usage: ./start-bitvmx.sh up -d (creates network + bootstraps broker key/pubkey_hash)
# Manual usage (advanced): docker compose --env-file .env.local -f docker-compose.bitvmx.yml up -d
# Volume ../../resources -> /app/resources: BitVMX verifier assets (e.g. union-verifier.yaml)
# live in resources/; coordinator config uses /app/resources/union-verifier.yaml.
# BitVMX client config is generated per operator under ${BASE_STORAGE_PATH:-$HOME}/.union_bridge/op_N/bitvmx/...

services:
  bitvmx-client-1:
    extends:
      file: ../bitvmx-client/docker-compose.yml
      service: bitvmx-client
    container_name: bitvmx-client-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLIENT_OP: op_1
    ports:
      - "22222:22222"
    volumes:
      - ${BASE_STORAGE_PATH:-$HOME}/.union_bridge/op_1/bitvmx:/app/config
      - ../../resources:/app/resources:ro
      - db-bitvmx-1:/tmp
    networks:
      bitvmx-shared-network:
        ipv4_address: 172.20.0.11

  bitvmx-client-2:
    extends:
      file: ../bitvmx-client/docker-compose.yml
      service: bitvmx-client
    container_name: bitvmx-client-2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLIENT_OP: op_2
    ports:
      - "33333:33333"
    volumes:
      - ${BASE_STORAGE_PATH:-$HOME}/.union_bridge/op_2/bitvmx:/app/config
      - ../../resources:/app/resources:ro
      - db-bitvmx-2:/tmp
    networks:
      bitvmx-shared-network:
        ipv4_address: 172.20.0.12

  bitvmx-client-3:
    extends:
      file: ../bitvmx-client/docker-compose.yml
      service: bitvmx-client
    container_name: bitvmx-client-3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLIENT_OP: op_3
    ports:
      - "44444:44444"
    volumes:
      - ${BASE_STORAGE_PATH:-$HOME}/.union_bridge/op_3/bitvmx:/app/config
      - ../../resources:/app/resources:ro
      - db-bitvmx-3:/tmp
    networks:
      bitvmx-shared-network:
        ipv4_address: 172.20.0.13

  bitvmx-client-4:
    extends:
      file: ../bitvmx-client/docker-compose.yml
      service: bitvmx-client
    container_name: bitvmx-client-4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLIENT_OP: op_4
    ports:
      - "55554:55554"
    volumes:
      - ${BASE_STORAGE_PATH:-$HOME}/.union_bridge/op_4/bitvmx:/app/config
      - ../../resources:/app/resources:ro
      - db-bitvmx-4:/tmp
    networks:
      bitvmx-shared-network:
        ipv4_address: 172.20.0.14

networks:
  bitvmx-shared-network:
    external: true

volumes:
  db-bitvmx-1:
  db-bitvmx-2:
  db-bitvmx-3:
  db-bitvmx-4:
