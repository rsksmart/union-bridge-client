# Anvil side of the local blockchain stack. bitcoind is supplied via compose's
# `include:` from the shared ../docker-compose.bitcoind.yaml so the bitcoind
# service definition isn't duplicated across the two chain composes.
name: blockchains
include:
  - ../docker-compose.bitcoind.yaml
services:
  # Starts the anvil client
  anvil:
    image: ${PREDEPLOYED_ANVIL_IMAGE_BASE}:${CONTRACTS_IMAGE_TAG:-local-build}
    platform: linux/amd64
    build:
      context: ${CONTRACTS_CONTEXT_PATH}
      dockerfile: ${PREDEPLOYED_ANVIL_DOCKERFILE}
      args:
        CHAIN_ID: ${CHAIN_ID}
        MNEMONIC: ${MNEMONIC}
        DEPLOYER_INDEX: ${DEPLOYER_INDEX}
    container_name: anvil
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    working_dir: /anvil
    ports:
      - "8545:8545"
    command: ["--host", "0.0.0.0", "--port", "8545", "--load-state", "/opt/anvil/predeployed-state.json"]
    healthcheck:
      test: ["CMD", "cast", "balance", "-e", "0x8e24bfC030303965E04151bf7c24114082E75AD2"]
      start_period: 1s
