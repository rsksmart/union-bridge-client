blockchain.config.name = regtest
blockchain.config.consensusRules.rskip144 = 0
blockchain.config.consensusRules.rskip502 = 0
database.dir = /var/lib/rsk/database/regtest
keyvalue.datasource = rocksdb
transaction.accountTxRateLimit.enabled = false
scoring.punishmentEnabled = false
cache.blooms.persist-snapshot = false

peer {
  connection.timeout = 10
  port = 50507
  discovery {
    enabled = true
    ip.list = ["rskj:50505"]
  }
  maxActivePeers = 30
  filter {
    maxConnections = 16
  }
}

rpc {
  maxResponseSize = 0
  providers {
    web {
      cors = "*"
      max_batch_requests_size = 100
      http {
        enabled = true
        bind_address = 0.0.0.0
        hosts = ["*"]
        port = 4444
      }
      ws {
        enabled = false
        bind_address = 0.0.0.0
        port = 4445
      }
    }
  }
}

federator {
  enabled = true
  signers {
    BTC {
      type = "keyFile"
      path = "/etc/rsk/federator1.key"
    }
    RSK {
      type = "keyFile"
      path = "/etc/rsk/federator1.key"
    }
    MST {
      type = "keyFile"
      path = "/etc/rsk/federator1.key"
    }
  }
  bitcoinPeerAddresses = ["bitcoind:18444"]
  amountOfHeadersToSend = 300
  updateBridgeBtcBlockchain = true
  updateBridgeBtcCoinbaseTransactions = true
  updateBridgeBtcTransactions = true
}

miner.client.enabled = false
