# This file is used to start the bitcoind client, anvil client, and deploy the smart contracts
name: blockchains
services:
  # Starts the bitcoind client
  bitcoind:
    image: "ruimarinho/bitcoin-core"
    container_name: bitcoind
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BITCOIN_DATA: /data
    command:
      - -regtest=1
      - -printtoconsole
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=foo
      - -rpcpassword=rpcpassword
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -wallet=mainwallet
    ports:
      - 18443:18443

  # Starts the anvil client
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    platform: linux/amd64
    container_name: anvil
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    working_dir: /anvil
    ports:
      - "8545:8545"
    command: anvil
    healthcheck:
      test: ["CMD", "cast", "balance", "-e", "0x8e24bfC030303965E04151bf7c24114082E75AD2"]
      start_period: 1s

  # Deploy smart contracts
  deploy-contracts:
    image: ${CONTRACTS_IMAGE_BASE}:${CONTRACTS_IMAGE_TAG:-local-build}
    platform: linux/amd64
    build:
      context: ${CONTRACTS_CONTEXT_PATH}
      dockerfile: ${CONTRACTS_DOCKERFILE}
    container_name: deploy-contracts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - RPC_URL=${ANVIL_RPC_URL}
      - MNEMONIC=${MNEMONIC}
      - DEPLOYER_INDEX=${DEPLOYER_INDEX}
    # deploy-local.sh reads LOCAL_RPC from .env. We inject RPC_URL at runtime so we don't rely on
    # the image's .env (especially with registry vs local-build contract images).
    command:
      - "sed -i \"s|LOCAL_RPC=.*|LOCAL_RPC=$$RPC_URL|\" .env && bash shell/script/deploy/deploy-local.sh"
    depends_on:
      anvil:
        condition: service_healthy