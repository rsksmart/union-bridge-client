# This file is used to start the bitcoind client and predeployed Anvil chain.
name: blockchains
services:
  # Starts the bitcoind client
  bitcoind:
    image: "ruimarinho/bitcoin-core"
    container_name: bitcoind
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BITCOIN_DATA: /data
    command:
      - -regtest=1
      - -printtoconsole
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=foo
      - -rpcpassword=rpcpassword
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -wallet=mainwallet
    ports:
      - 18443:18443

  # Starts the anvil client
  anvil:
    image: ${PREDEPLOYED_ANVIL_IMAGE_BASE}:${CONTRACTS_IMAGE_TAG:-local-build}
    platform: linux/amd64
    build:
      context: ${CONTRACTS_CONTEXT_PATH}
      dockerfile: ${PREDEPLOYED_ANVIL_DOCKERFILE}
      args:
        CHAIN_ID: ${CHAIN_ID}
        MNEMONIC: ${MNEMONIC}
        DEPLOYER_INDEX: ${DEPLOYER_INDEX}
    container_name: anvil
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    working_dir: /anvil
    ports:
      - "8545:8545"
    command: ["--host", "0.0.0.0", "--port", "8545", "--load-state", "/opt/anvil/predeployed-state.json"]
    healthcheck:
      test: ["CMD", "cast", "balance", "-e", "0x8e24bfC030303965E04151bf7c24114082E75AD2"]
      start_period: 1s
