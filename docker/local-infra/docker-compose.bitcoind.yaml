# Shared bitcoind regtest service, included by both anvil/docker-compose.yaml
# and rskj/docker-compose.yaml via compose's `include:` directive.
#
# Variables interpolated here (BITCOIND_USER / BITCOIND_PASSWORD) are taken
# from whichever chain's .env file is passed at the compose invocation. Both
# chain env files define the same credentials.
services:
  bitcoind:
    # Pinned to a digest so the bitcoind regtest behavior is reproducible even
    # if upstream moves the 24.0.1 tag. Keep the tag in the reference for human
    # readability; the @sha256:... is what actually anchors the image.
    image: "ruimarinho/bitcoin-core:24.0.1@sha256:84bc9bb6d466d6b7eb7edaf3c35fca15b454ee0b9bf24b71593f37d3c41a4355"
    container_name: bitcoind
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BITCOIN_DATA: /data
    command:
      - -regtest=1
      - -printtoconsole
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=${BITCOIND_USER}
      - -rpcpassword=${BITCOIND_PASSWORD}
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -wallet=mainwallet
    ports:
      - "18443:18443"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bitcoin-cli -regtest -rpcuser=${BITCOIND_USER} -rpcpassword=${BITCOIND_PASSWORD} getblockchaininfo > /dev/null",
        ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 20
