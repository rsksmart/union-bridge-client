# Local blockchain stack for Rootstock-based development (bitcoind + rskj + powpeg + contracts deploy).
name: blockchains
services:
  bitcoind:
    image: "ruimarinho/bitcoin-core:24.0.1"
    container_name: bitcoind
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BITCOIN_DATA: /data
    command:
      - -regtest=1
      - -printtoconsole
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=${BITCOIND_USER}
      - -rpcpassword=${BITCOIND_PASSWORD}
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -wallet=mainwallet
    ports:
      - "18443:18443"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bitcoin-cli -regtest -rpcuser=${BITCOIND_USER} -rpcpassword=${BITCOIND_PASSWORD} getblockchaininfo > /dev/null",
        ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 20

  rskj:
    image: "rsksmart/rskj:${RSKJ_TAG}"
    platform: ${PLATFORM}
    container_name: rskj
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DEFAULT_JVM_OPTS: "-Xms2G -Xmx4G -XX:+UseGCOverheadLimit"
      RSKJ_SYS_PROPS: "-Drsk.conf.file=/etc/rsk/node.conf -Dpeer.privateKey=${RSKJ_PEER_PRIVATE_KEY}"
      RSKJ_LOG_PROPS: "-Dlogging.stdout=INFO"
      RSKJ_CLASS: "co.rsk.Start"
      RSKJ_OPTS: ""
    ports:
      - "8545:4444"
      - "8546:4445"
    volumes:
      - ./rskj.node.conf:/etc/rsk/node.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'co.rsk.Start'"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 30

  powpeg-node:
    image: "rsksmart/powpeg-node:${POWPEG_TAG}"
    platform: ${PLATFORM}
    container_name: powpeg-node
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rskj:
        condition: service_healthy
      bitcoind:
        condition: service_healthy
    environment:
      DEFAULT_JVM_OPTS: "-Xss4M -Xms1G"
      RSKJ_SYS_PROPS: "-Drsk.conf.file=/etc/rsk/node.conf -Dpeer.active.0.ip=rskj -Dpeer.active.0.port=50505 -Dpeer.active.0.nodeId=${RSKJ_NODE_ID}"
      RSKJ_LOG_PROPS: "-Dlogging.stdout=INFO"
      RSKJ_CLASS: "co.rsk.federate.FederateRunner"
      RSKJ_OPTS: "--reset"
    volumes:
      - ./powpeg/config/node-federator1.conf:/etc/rsk/node.conf:ro
      - ./powpeg/config/federator1.key:/etc/rsk/federator1.key:ro
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'co.rsk.federate.FederateRunner'"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 30

  deploy-contracts:
    build:
      context: ${CONTRACTS_CONTEXT_PATH}
      dockerfile: ${CONTRACTS_DOCKERFILE}
    platform: ${PLATFORM}
    container_name: deploy-contracts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RPC_URL: ${RSKJ_HTTP_URL}
      MNEMONIC: ${MNEMONIC}
      DEPLOYER_INDEX: ${DEPLOYER_INDEX}
      IS_TEST: "false"
    entrypoint: []
    command:
      - bash
      - -lc
      - |
        if [ -z "$${RPC_URL:-}" ]; then
          echo "Error: RPC_URL is required"
          exit 1
        fi
        if [ -z "$${MNEMONIC:-}" ]; then
          echo "Error: MNEMONIC is required"
          exit 1
        fi
        echo "================ DEPLOY CONTRACTS TO $${RPC_URL} ================"
        forge script script/deploy/DeployScript.s.sol \
          --rpc-url "$${RPC_URL}" \
          --legacy \
          --broadcast \
          --slow \
          -v
    depends_on:
      rskj:
        condition: service_healthy
