#####################################################################################################################################
# DISCLAIMER: This docker-compose file is intended for development and testing purposes only, not for production use. ###############
#####################################################################################################################################

services:
  # Operator-specific broker PEM bind mounts, keystore overrides, and runtime env overrides belong in
  # docker/operator/docker-compose.yml. Keep this base compose build-safe.
  block-indexer:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-block-indexer:${UC_TAG:-latest}
    build:
      context: ../../
      dockerfile: docker/build/Dockerfile
      args:
        - CRATE=block-indexer
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - db-blocks:/app/db/blocks
      - db-block-broker:/app/db/broker/block-indexer
    environment:
      - CONFIG=${CONFIG:-dummy-config-name}
      - UB_LOG_DIR=${UB_LOG_DIR:-/app/logs}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RUST_LOG=${RUST_LOG:-}
    restart: no
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "pgrep", "-f", "block-indexer"] # TODO improve with health endpoint
    command: ["sh", "-c", "/app/block-indexer --config $$CONFIG"]

  log-indexer:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-log-indexer:${UC_TAG:-latest}
    build:
      context: ../../
      dockerfile: docker/build/Dockerfile
      args:
        - CRATE=log-indexer
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - db-logs:/app/db/logs
      - db-log-broker:/app/db/broker/log-indexer
    environment:
      - CONFIG=${CONFIG:-dummy-config-name}
      - UB_LOG_DIR=${UB_LOG_DIR:-/app/logs}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RUST_LOG=${RUST_LOG:-}
    restart: no
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "pgrep", "-f", "log-indexer"] # TODO improve with health endpoint
    command: ["sh", "-c", "/app/log-indexer --config $$CONFIG"]

  coordinator:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-coordinator:${UC_TAG:-latest}
    build:
      context: ../../
      dockerfile: docker/build/Dockerfile
      args:
        - CRATE=coordinator
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${KEYSTORE_DIR}:/keystore-src:ro
      - ${RESOURCES_DIR:-../../resources}:/app/resources:ro
      - db-coordinator:/app/db/coordinator
    restart: no
    environment:
      KEY_STORE_PASSWORD: ${KEY_STORE_PASSWORD}
      CONFIG: ${CONFIG:-dummy-config-name}
      UB_LOG_DIR: ${UB_LOG_DIR:-/app/logs}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-}
      # Temporary protocol sizing workaround until we source these values from contracts.
      SLOTS_PER_PACKAGE:
      COMMITTEE_MEMBER_COUNT:
      COMMITTEE_PROVER_COUNT:
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "pgrep", "-f", "coordinator"]
    entrypoint: ["sh", "/app/keystore-entrypoint.sh"]
    command: ["sh", "-c", "exec /app/coordinator --config $$CONFIG"]
    depends_on:
      block-indexer:
        condition: service_healthy
      log-indexer:
        condition: service_healthy
      user-api:
        condition: service_healthy

  user-api:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-user-api:${UC_TAG:-latest}
    build:
      context: ../../
      dockerfile: docker/build/Dockerfile
      args:
        - CRATE=user-api
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${KEYSTORE_DIR}:/keystore-src:ro
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - CONFIG=${CONFIG:-dummy-config-name}
      - UB_LOG_DIR=${UB_LOG_DIR:-/app/logs}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RUST_LOG=${RUST_LOG:-}
    restart: no
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "pgrep", "-f", "user-api"]
    entrypoint: ["sh", "/app/keystore-entrypoint.sh"]
    command: ["sh", "-c", "exec /app/user-api --config $$CONFIG"]

volumes:
  db-blocks:
  db-block-broker:
  db-logs:
  db-log-broker:
  db-coordinator:
