# DISCLAIMER: This docker-compose file is intended for development and testing purposes only, not for production use. ###############
#####################################################################################################################################

services:
  # Operator-specific broker PEM bind mounts and runtime env overrides belong in
  # docker/operator/docker-compose.yml. Keep this base compose build-safe.
  block-indexer:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-block-indexer:${UC_TAG:-latest}
    build:
      context: ../../
      dockerfile: docker/build/Dockerfile
      args:
        - CRATE=block-indexer
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - db-blocks:/app/db/blocks
    environment:
      - CONFIG=${CONFIG:-dummy-config-name}
    restart: no
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "pgrep", "-f", "block-indexer"] # TODO improve with health endpoint
    command: ["sh", "-c", "/app/block-indexer --config $CONFIG"]

  log-indexer:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-log-indexer:${UC_TAG:-latest}
    build:
      context: ../../
      dockerfile: docker/build/Dockerfile
      args:
        - CRATE=log-indexer
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - db-logs:/app/db/logs
    environment:
      - CONFIG=${CONFIG:-dummy-config-name}
    restart: no
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "pgrep", "-f", "log-indexer"] # TODO improve with health endpoint
    command: ["sh", "-c", "/app/log-indexer --config $CONFIG"]

  coordinator:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-coordinator:${UC_TAG:-latest}
    build:
      context: ../../
      dockerfile: docker/build/Dockerfile
      args:
        - CRATE=coordinator
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - keystore:/keystore
      - ${RESOURCES_DIR:-../../resources}:/app/resources:ro
      - db-coordinator:/app/db/coordinator
    restart: no
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - BITCOIN_NETWORK=${BITCOIN_NETWORK:-dummy-bitcoin-network}
      - CONFIG=${CONFIG:-dummy-config-name}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "pgrep", "-f", "coordinator"]
    command: ["sh", "-c", "/app/key-setup.sh && exec /app/coordinator --config $CONFIG"]
    depends_on:
      block-indexer:
        condition: service_healthy
      log-indexer:
        condition: service_healthy
      user-api:
        condition: service_healthy

  user-api:
    platform: ${PLATFORM}
    image: ghcr.io/rsksmart/union-client-user-api:${UC_TAG:-latest}
    build:
      context: ../../
      dockerfile: docker/build/Dockerfile
      args:
        - CRATE=user-api
    volumes:
      - ${CONFIG_DIR:-../../config}:/app/config/:ro
      - ${LOGGER_PATH:-./log4rs.yaml}:/app/log4rs.yaml:ro
      - keystore:/keystore
    environment:
      - KEY_STORE_PASSWORD=${KEY_STORE_PASSWORD}
      - CONFIG=${CONFIG:-dummy-config-name}
    restart: no
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      test: ["CMD", "pgrep", "-f", "user-api"]
    command: ["sh", "-c", "/app/key-setup.sh && exec /app/user-api --config $CONFIG"]

volumes:
  keystore:
  db-blocks:
  db-logs:
  db-coordinator:
