# ═══════════════════════════════════════════════════════
# Indexers
# ═══════════════════════════════════════════════════════

[indexer]

# Override base: start from current tip; initial_block_hash from base is ignored in this env.
start_from = "best"
storage.path = "/app/db/" # This should match the volume mount in docker-compose

[block_indexer]
broker_key_path = "/app/broker.pem"

[log_indexer]
broker_key_path = "/app/broker.pem"

# ═══════════════════════════════════════════════════════
# Coordinator
# ═══════════════════════════════════════════════════════

[coordinator]
storage_path = "/app/db/" # This should match the volume mount in docker-compose
blocks.host = "block-indexer"
logs.host = "log-indexer"
user.host = "user-api"
broker.key_path = "/app/broker.pem"

# ═══════════════════════════════════════════════════════
# Key Store
# ═══════════════════════════════════════════════════════

[key_store]
user_path = "/keystore/user"      # should match the mounted host keystore layout
member_path = "/keystore/member"  # should match the mounted host keystore layout

# ═══════════════════════════════════════════════════════
# User API
# ═══════════════════════════════════════════════════════

[user_api]
broker_key_path = "/app/broker.pem"

# ═══════════════════════════════════════════════════════
# Bridge Flow Configuration
# ═══════════════════════════════════════════════════════

[flows.committee]
drp_program_definition = "/app/resources/union-verifier.yaml"
