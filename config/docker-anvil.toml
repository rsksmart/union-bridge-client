# ═══════════════════════════════════════════════════════
# Common Configuration
# ═══════════════════════════════════════════════════════

environment = "local-anvil"
provider.rootstock.url = "ws://host.docker.internal:8545"
# url: "ws://node-container:8545" # if running anvil/node in a container
# url: "ws://<external-rootstock-node>:4445/websocket" # if connecting to an external node

# ═══════════════════════════════════════════════════════
# Deployed Contracts
# ═══════════════════════════════════════════════════════
# Same predeployed Anvil chain state as the local-anvil profile, since both
# docker-anvil and local-anvil talk to the same predeployed Anvil instance —
# the only thing that differs between them is the network URL (host.docker
# .internal vs 127.0.0.1) for operators running inside vs outside containers.

