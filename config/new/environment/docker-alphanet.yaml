    address: "0x7F8Eef5586D5e35115638bB9Cf7185E7F236dC25"

# =============================================================================
# BLOCK INDEXER SERVICE
# =============================================================================

block_notifier:
  broker_port: 12345

# =============================================================================
# LOG INDEXER SERVICE
# =============================================================================

log_notifier:
  broker_port: 56789

# =============================================================================
# COORDINATOR SERVICE
# =============================================================================

block_broker:
  host: "block-indexer"
  port: 12345

log_broker:
  host: "log-indexer"
  port: 56789

user_broker:
  host: "user-api"
  port: 5550

#bitvmx_broker: # can be overriden with env vars UB_bitvmx_broker__ip and UB_bitvmx_broker__port
#  host: "172.25.0.14"
#  port: 9094

broker_client_id: 333

storage_path: "/app/db/" # This should match the volume mount in docker-compose# =============================================================================

# =============================================================================
# USER API SERVICE
# =============================================================================

coordinator_broker_client_id: 333

broker_server_port: 5550

http_server_port: 5551

# =============================================================================
# TRANSACTION DISPATCHER SERVICE
# =============================================================================

key_store:
  path: "/keystore/key.json" # should match the one configured in key-setup.sh

server:
  url: "0.0.0.0:3000"
