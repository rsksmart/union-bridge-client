# =============================================================================
# ALPHANET ENVIRONMENT - Overrides to base.yaml
# =============================================================================

# =============================================================================
# COMMON CONFIGURATION (SHARED ACROSS SERVICES)
# =============================================================================

indexer:
  initial_block_hash: "0x27de5a07c7e9b812c3e7ee4c7c51fa131280ed9e16f1d70b5751034943d75c47"
  storage:
    path: "/app/db/" # This should match the volume mount in docker-compose

provider:
  rootstock:
    url: "ws://host.docker.internal:8545" # if running anvil/node on host
    # url: "ws://node-container:8545" # if running anvil/node in a container
    # url: "ws://rskj-01.testnet.ub.iovlabs.net:4445/websocket" # if connecting to an external node

bitcoin_network: "testnet"

contracts:
  - name: "FakePegManager"
    address: "0x3Aa5ebB10DC797CAC828524e59A333d0A371443c"
  - name: "PegManager"
    address: "0x3A2330364700f36fD711a9d90ec38ba9cc4173b2"
  - name: "SignatureManager"
    address: "0x30b88Ad64250A9174483270274e1CA7FbbD81DaE"
  - name: "CommitteeRegistry"
    address: "0xC789E0a607542AFD6243DC529a1F7b86a481C6d8"
  - name: "MemberRegistry"
    address: "0xFAa86EA07825d95ac4a619E4D3bBAbDE2Ab1C923"
  - name: "StreamManager"
    address: "0x7F8Eef5586D5e35115638bB9Cf7185E7F236dC25"

# =============================================================================
# BLOCK INDEXER SERVICE
# =============================================================================

# =============================================================================
# LOG INDEXER SERVICE
# =============================================================================

# =============================================================================
# COORDINATOR SERVICE
# =============================================================================

block_broker:
  host: "block-indexer"

log_broker:
  host: "log-indexer"

user_broker:
  host: "user-api"

storage_path: "/app/db/" # This should match the volume mount in docker-compose

# =============================================================================
# USER API SERVICE
# =============================================================================

# =============================================================================
# TRANSACTION DISPATCHER SERVICE
# =============================================================================

key_store:
  path: "/keystore/key.json" # should match the one configured in key-setup.sh
