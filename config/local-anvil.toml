environment = "local-anvil"

# ═══════════════════════════════════════════════════════
# Deployed Contracts
# ═══════════════════════════════════════════════════════
# Addresses come from the predeployed Anvil chain state shipped by
# Dockerfile_predeployed_anvil (deterministic CREATE addresses from
# mnemonic-index-0 deployer, with BridgeMock at nonce 0).
# NativeBridge here is the RSKIP502 precompile placeholder — it has no code
# on Anvil; uses_fake_native_bridge("local-anvil") returns true so the
# coordinator uses the Dummy verifier instead of calling the precompile.

