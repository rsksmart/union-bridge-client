# ═══════════════════════════════════════════════════════
# Common Configuration
# ═══════════════════════════════════════════════════════

# Override via env: UB__PROVIDER__ROOTSTOCK__URL
provider.rootstock.url = "ws://<RSK_NODE_HOST>:4445"
bitcoin_network = "regtest"

[[contracts]]
name = "FakePegManager"
address = "0x7Cd31D33302B6f5Bc45763487195Ae329a915beB"

[[contracts]]
name = "PegManager"
address = "0xCceA54bAB6755690595b7D8fAf299bd02c597F46"

[[contracts]]
name = "SignatureManager"
address = "0x7B070f39f6bd74De7Fc0678ebd1dee3b4F06853B"

[[contracts]]
name = "CommitteeRegistry"
address = "0x09cBe2b2a151A58AAae1E89C2809c2d8E1666f43"

[[contracts]]
name = "MemberRegistry"
address = "0x185DA4bbEc7DA24ec252505094E9ba13B1a5f0e6"

[[contracts]]
name = "StreamManager"
address = "0xC689FB08B10BE1080c87dC6f8EdcA7Cd20471218"

[[contracts]]
name = "NativeBridge"
address = "0x0000000000000000000000000000000001000006"

[indexer]

storage.path = "/app/db/" # This should match the volume mount in docker-compose

# ═══════════════════════════════════════════════════════
# Coordinator
# ═══════════════════════════════════════════════════════

[coordinator]
storage_path = "/app/db/"     # This should match the volume mount in docker-compose
blocks.host = "block-indexer"
logs.host = "log-indexer"
user.host = "user-api"

# ═══════════════════════════════════════════════════════
# Transaction Dispatcher
# ═══════════════════════════════════════════════════════

[transaction_dispatcher]
key_store.user_path = "/keystore/user-key.json"     # should match the one configured in key-setup.sh
key_store.member_path = "/keystore/member-key.json" # should match the one configured in key-setup.sh
