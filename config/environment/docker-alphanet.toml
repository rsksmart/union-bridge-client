# ═══════════════════════════════════════════════════════
# Common Configuration
# ═══════════════════════════════════════════════════════

provider.rootstock.url = "ws://10.1.0.53:4445" # if running in AWS and accessed from AWS
# url: "ws://rskj-01.testnet.ub.iovlabs.net:4445/websocket" # if running in AWS and accessed from outside
bitcoin_network = "testnet"

[[contracts]]
name = "FakePegManager"
address = "0xa85233C63b9Ee964Add6F2cffe00Fd84eb32338f"

[[contracts]]
name = "PeginManager"
address = "0x610178dA211FEF7D417bC0e6FeD39F05609AD788"

[[contracts]]
name = "PegoutManager"
address = "0xA51c1fc2f0D1a1b8494Ed1FE312d7C3a78Ed91C0"

[[contracts]]
name = "SignatureManager"
address = "0x959922bE3CAee4b8Cd9a407cc3ac1C251C2007B1"

[[contracts]]
name = "CommitteeRegistry"
address = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"

[[contracts]]
name = "MemberRegistry"
address = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"

[[contracts]]
name = "StreamManager"
address = "0x9A676e781A523b5d0C0e43731313A708CB607508"

[[contracts]]
name = "NativeBridge"
address = "0x0000000000000000000000000000000001000006"

[indexer]

# Override base: start from current tip; initial_block_hash from base is ignored in this env.
start_from = "best"
storage.path = "/app/db/" # This should match the volume mount in docker-compose

# ═══════════════════════════════════════════════════════
# Coordinator
# ═══════════════════════════════════════════════════════

[coordinator]
storage_path = "/app/db/" # This should match the volume mount in docker-compose
blocks.host = "block-indexer"
logs.host = "log-indexer"
user.host = "user-api"
broker.key_path = "/app/broker.pem"

[bridge.committee]
drp_program_definition = "/app/resources/hello-world.yaml"

# ═══════════════════════════════════════════════════════
# Key Store
# ═══════════════════════════════════════════════════════

[key_store]
user_path = "/keystore/user-key.json" # should match the one configured in key-setup.sh
member_path = "/keystore/member-key.json" # should match the one configured in key-setup.sh

# ═══════════════════════════════════════════════════════
# Transaction Dispatcher
# ═══════════════════════════════════════════════════════

[transaction_dispatcher]

[block_indexer]
broker_key_path = "/app/broker.pem"

[log_indexer]
broker_key_path = "/app/broker.pem"

[user_api]
broker_key_path = "/app/broker.pem"
