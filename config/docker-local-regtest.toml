[indexer]
start_from = "best"
storage.path = "/app/db/"

[block_indexer]
broker_key_path = "/app/broker.pem"

[log_indexer]
broker_key_path = "/app/broker.pem"

[coordinator]
storage_path = "/app/db/"
blocks.host = "block-indexer"
logs.host = "log-indexer"
user.host = "user-api"
broker.key_path = "/app/broker.pem"

[key_store]
user_path = "/keystore/user"
member_path = "/keystore/member"

[user_api]
broker_key_path = "/app/broker.pem"

[flows.committee]
drp_program_definition = "/app/resources/union-verifier.yaml"
