# Local Rootstock regtest profile for Docker operator containers.

provider.rootstock.url = "ws://host.docker.internal:4445"
environment = "local-regtest"
bitcoin_network = "regtest"

[[contracts]]
name = "TestContractDyn"
address = "0x663B50C9DA9Bd586f855aF13e91EF2f0954c9761"

[[contracts]]
name = "TestContractCompiled"
address = "0x9d4b2c05818A0086e641437fcb64ab6098c7BbEc"

[[contracts]]
name = "PeginManager"
address = "0x959922bE3CAee4b8Cd9a407cc3ac1C251C2007B1"

[[contracts]]
name = "PegoutManager"
address = "0x68B1D87F95878fE05B998F19b66F4baba5De1aed"

[[contracts]]
name = "SignatureManager"
address = "0x9A676e781A523b5d0C0e43731313A708CB607508"

[[contracts]]
