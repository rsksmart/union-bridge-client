# ═══════════════════════════════════════════════════════
# Common Configuration
# ═══════════════════════════════════════════════════════

provider.rootstock.url = "ws://127.0.0.1:8545"
bitcoin_network = "regtest"

# Contract addresses are per-env (Anvil vs RSKj produce different deterministic
# CREATE addresses because the Anvil predeploy deploys a BridgeMock and the
# RSKj deploy doesn't). Each profile overlay declares its own [[contracts]] list.

# ═══════════════════════════════════════════════════════
# Indexers
# ═══════════════════════════════════════════════════════

[indexer]

# start_from controls how indexers pick the startup point:
# - "hash": require initial_block_hash and panic if it is missing/invalid/not found on provider.
# - "best": ignore initial_block_hash and start from provider best block at startup.
start_from = "hash"
initial_block_hash = "0xa3b056ebbb4ca08f79975bc9a1d53b4fc68b011b0480b2241f7c03543bc3d22c"
storage.path = "/{BASE_STORAGE_PATH}/.union_bridge/op_1/local_database"
cache.size = 1000
sync.finality_depth = 100
sync.batch_size = 100

[block_indexer]

notifier.port = 10001
broker_key_path = "/{BASE_STORAGE_PATH}/.union_bridge/op_1/union-client/broker/block-indexer.pem"

[log_indexer]

notifier.port = 20001
broker_key_path = "/{BASE_STORAGE_PATH}/.union_bridge/op_1/union-client/broker/log-indexer.pem"

# ═══════════════════════════════════════════════════════
# Coordinator
# ═══════════════════════════════════════════════════════

[coordinator]

logs.host = "0.0.0.0"
logs.port = 20001
# Local multi-client runs override this from config/env_overrides/local-committee.env via the provisioned .pubkey_hash file.
logs.pubkey_hash = "<to_patch_with_env>"
blocks.host = "0.0.0.0"
blocks.port = 10001
# Local multi-client runs override this from config/env_overrides/local-committee.env via the provisioned .pubkey_hash file.
blocks.pubkey_hash = "<to_patch_with_env>"
user.host = "0.0.0.0"
user.port = 30001
# Local multi-client runs override this from config/env_overrides/local-committee.env via the provisioned .pubkey_hash file.
user.pubkey_hash = "<to_patch_with_env>"
bitvmx.host = "0.0.0.0"
bitvmx.port = 22222
# The pubkey_hash of the bitvmx broker server's message queue (components.bitvmx.pubkey_hash in bitvmx-client config)
bitvmx.pubkey_hash = "1d10fa43ebbf6674d74caa3e9032711ade09d98ea7d20f89459f61152bebda1e" # can be patched with env
broker.client_id = 101
broker.key_path = "/{BASE_STORAGE_PATH}/.union_bridge/op_1/union-client/broker/coordinator.pem"
storage_path = "/{BASE_STORAGE_PATH}/.union_bridge/op_1/local_database"
check_period_secs = 1
bitvmx_not_responding_threshold_secs = 30
bitvmx_ping_after_silence_secs = 15

# ═══════════════════════════════════════════════════════
# Key Store
# ═══════════════════════════════════════════════════════

[key_store]
# Path to user keystore (for user role transactions)
user_path = "/{BASE_STORAGE_PATH}/.union_bridge/op_1/union-client/keystore/user"
# Path to member keystore (for member role transactions)
member_path = "/{BASE_STORAGE_PATH}/.union_bridge/op_1/union-client/keystore/member"

# ═══════════════════════════════════════════════════════
# User API
# ═══════════════════════════════════════════════════════

[user_api]

# Temporary coordinator routing config for user-api broker messages.
# Remove these coordinator.* settings when user-api is removed.
coordinator.client_id = 101
# Local multi-client runs override this from config/env_overrides/local-committee.env via the provisioned .pubkey_hash file.
coordinator.pubkey_hash = "<to_patch_with_env>"
broker_key_path = "/{BASE_STORAGE_PATH}/.union_bridge/op_1/union-client/broker/user-api.pem"
notifier.port = 30001
http.port = 40001
# Bearer token for admin endpoints (e.g., POST /admin/fail-flow). Leave unset to disable.
# admin_token = ""

# ═══════════════════════════════════════════════════════
# Bridge Flow Configuration
# ═══════════════════════════════════════════════════════

[flows.common]
# Required RSK block confirmations for events
rsk_confirmations = 3
# BTC confirmations used by non-Native-Bridge coordinator flows
btc_confirmations = 1
# Blocks delay before rechecking BTC transaction status
btc_status_retry_blocks = 20

[flows.reject_pegin]
# Minimum BTC transaction confirmations required to reject a pegin
min_tx_confirmations = 1
# Blocks delay before rechecking transaction status
blocks_delay_for_tx_check = 6

[flows.pegout]
# Timeout for advance funds before triggering operator take (seconds)
# Test environments: 600 (10 min), Production: 7200 (2 hours)
# Must match contracts, or even better, be retrieved from contracts settings
advance_funds_timeout_secs = 600

[flows.committee]
drp_program_definition = "resources/union-verifier.yaml"

[flows.native_bridge]
# Extra confirmations required on top of common.btc_confirmations
btc_confirmations_buffer = 1

# ═══════════════════════════════════════════════════════
# Transaction Dispatcher
# ═══════════════════════════════════════════════════════

[transaction_dispatcher]

transaction.gas_bumps_t1 = 3
