# ═══════════════════════════════════════════════════════
# Key Store
# ═══════════════════════════════════════════════════════

[key_store]
# Path to user keystore (for user role transactions)
user_path = "/{BASE_STORAGE_PATH}/.union_bridge/keystore/multi-client-1-user"
# Path to member keystore (for member role transactions)
member_path = "/{BASE_STORAGE_PATH}/.union_bridge/keystore/multi-client-1-member"
# Path to broker TLS key file (PEM format) for deterministic broker identity
broker_key_path = "/{BASE_STORAGE_PATH}/.union_bridge/keystore/broker.key"

# ═══════════════════════════════════════════════════════
# Coordinator
# ═══════════════════════════════════════════════════════

[coordinator]

logs.host = "0.0.0.0"
logs.port = 20001
blocks.host = "0.0.0.0"
blocks.port = 10001
user.host = "0.0.0.0"
user.port = 30001
bitvmx.host = "0.0.0.0"
bitvmx.port = 22222
# The pubkey_hash of the bitvmx broker server's message queue (components.bitvmx.pubkey_hash in bitvmx-client config)
bitvmx.pubkey_hash = "1d10fa43ebbf6674d74caa3e9032711ade09d98ea7d20f89459f61152bebda1e"
broker.client_id = 101
storage_path = "/{BASE_STORAGE_PATH}/.union_bridge/database/multi-client-1"
drp_program_definition = "../BitVMX-CPU/docker-riscv32/riscv32/build/hello-world.yaml"

# ═══════════════════════════════════════════════════════
# Block Indexer
# ═══════════════════════════════════════════════════════

[block_indexer]

notifier.port = 10001

# ═══════════════════════════════════════════════════════
# Log Indexer
# ═══════════════════════════════════════════════════════

[log_indexer]

notifier.port = 20001

# ═══════════════════════════════════════════════════════
# Transaction Dispatcher
# ═══════════════════════════════════════════════════════

[transaction_dispatcher]

transaction.gas_bumps_t1 = 3

# ═══════════════════════════════════════════════════════
# User API
# ═══════════════════════════════════════════════════════

[user_api]

coordinator.broker.client_id = 101
notifier.port = 30001
http.port = 40001
