# ═══════════════════════════════════════════════════════
# Common Configuration
# ═══════════════════════════════════════════════════════

provider.rootstock.url = "ws://127.0.0.1:8545"
bitcoin_network = "regtest"

[indexer]

# start_from controls how indexers pick the startup point:
# - "hash": require initial_block_hash and panic if it is missing/invalid/not found on provider.
# - "best": ignore initial_block_hash and start from provider best block at startup.
start_from = "hash"
initial_block_hash = "0xa3b056ebbb4ca08f79975bc9a1d53b4fc68b011b0480b2241f7c03543bc3d22c"
storage.path = "/{BASE_STORAGE_PATH}/.union_bridge/database/multi-client-1"
cache.size = 1000
sync.finality_depth = 100
sync.batch_size = 100

[[contracts]]
name = "TestContractDyn"
address = "0x663B50C9DA9Bd586f855aF13e91EF2f0954c9761"

[[contracts]]
name = "TestContractCompiled"
address = "0x9d4b2c05818A0086e641437fcb64ab6098c7BbEc"

[[contracts]]
name = "PeginManager"
address = "0x9A9f2CCfdE556A7E9Ff0848998Aa4a0CFD8863AE"

[[contracts]]
name = "PegoutManager"
address = "0x3Aa5ebB10DC797CAC828524e59A333d0A371443c"

[[contracts]]
name = "FakePegManager"
address = "0xa85233C63b9Ee964Add6F2cffe00Fd84eb32338f"

[[contracts]]
name = "SignatureManager"
address = "0x0B306BF915C4d645ff596e518fAf3F9669b97016"

[[contracts]]
name = "CommitteeRegistry"
address = "0x0DCd1Bf9A1b36cE34237eEaFef220932846BCD82"

[[contracts]]
name = "MemberRegistry"
address = "0xB7f8BC63BbcaD18155201308C8f3540b07f84F5e"

[[contracts]]
name = "StreamManager"
address = "0x0165878A594ca255338adfa4d48449f69242Eb8F"

[[contracts]]
name = "ChallengeManager"
address = "0x59b670e9fA9D0A427751Af201D676719a970857b"

[[contracts]]
name = "NativeBridge"
address = "0x0000000000000000000000000000000001000006"
# ═══════════════════════════════════════════════════════
# Key Store
# ═══════════════════════════════════════════════════════

[key_store]
# Path to user keystore (for user role transactions)
user_path = "/{BASE_STORAGE_PATH}/.union_bridge/keystore/multi-client-1-user"
# Path to member keystore (for member role transactions)
member_path = "/{BASE_STORAGE_PATH}/.union_bridge/keystore/multi-client-1-member"
# Path to broker TLS key file (PEM format) for deterministic broker identity
broker_key_path = "/{BASE_STORAGE_PATH}/.union_bridge/keystore/broker.key"

# ═══════════════════════════════════════════════════════
# Coordinator
# ═══════════════════════════════════════════════════════

[coordinator]

logs.host = "0.0.0.0"
logs.port = 20001
blocks.host = "0.0.0.0"
blocks.port = 10001
user.host = "0.0.0.0"
user.port = 30001
bitvmx.host = "0.0.0.0"
bitvmx.port = 22222
# The pubkey_hash of the bitvmx broker server's message queue (components.bitvmx.pubkey_hash in bitvmx-client config)
bitvmx.pubkey_hash = "1d10fa43ebbf6674d74caa3e9032711ade09d98ea7d20f89459f61152bebda1e"
broker.client_id = 101
storage_path = "/{BASE_STORAGE_PATH}/.union_bridge/database/multi-client-1"

[coordinator.advance_funds]
check_fork_guest_elf_path = "/app/config/check-fork-guest.bin"
max_zkp_status_retries = 99999999

# ═══════════════════════════════════════════════════════
# Bridge Flow Configuration
# ═══════════════════════════════════════════════════════

[bridge.coordinator]
# Required RSK block confirmations for events
required_confirmations = 5
# Period between coordinator check cycles (seconds)
check_period_secs = 1
# Threshold before considering BitVMX not responding (seconds)
bitvmx_not_responding_threshold_secs = 30
# Seconds of silence before sending ping to BitVMX
bitvmx_ping_after_silence_secs = 15

[bridge.pegin]
# Minimum BTC transaction confirmations for pegin
min_tx_confirmations = 1
# Blocks delay before rechecking transaction status
blocks_delay_for_tx_check = 20

[bridge.reject_pegin]
# Minimum BTC transaction confirmations for pegin
min_tx_confirmations = 1
# Blocks delay before rechecking transaction status
blocks_delay_for_tx_check = 6

[bridge.pegout]
# Blocks delay before rechecking transaction status
blocks_delay_for_tx_check = 20
# Minimum SPV proof confirmations
spv_proof_min_confirmations = 1
# Timeout for advance funds before triggering operator take (seconds)
# Alphanet: 600 (10 min), Local: 30 (1 sec cadence), Production: 7200 (2 hours)
advance_funds_timeout_secs = 600

[bridge.advance_funds]
# Minimum SPV proof confirmations for operator take
spv_proof_min_confirmations = 1
# Blocks delay before rechecking transaction status
blocks_delay_for_tx_check = 20

[bridge.committee]
# Minimum BitVMX funding balance (satoshis)
min_funding_balance = 20002000
# Minimum RSK balance (wei) - approx 1 RBTC + fees
min_rsk_balance = 1000000000500000
# Path to the DRP program definition YAML file
drp_program_definition = "resources/hello-world.yaml"

[bridge.native_bridge]
# Minimum confirmations from native bridge
min_tx_confirmations = 2

# ═══════════════════════════════════════════════════════
# Block Indexer
# ═══════════════════════════════════════════════════════

[block_indexer]

notifier.port = 10001

# ═══════════════════════════════════════════════════════
# Log Indexer
# ═══════════════════════════════════════════════════════

[log_indexer]

notifier.port = 20001

# ═══════════════════════════════════════════════════════
# Transaction Dispatcher
# ═══════════════════════════════════════════════════════

[transaction_dispatcher]

transaction.gas_bumps_t1 = 3

# ═══════════════════════════════════════════════════════
# User API
# ═══════════════════════════════════════════════════════

[user_api]

coordinator.broker.client_id = 101
notifier.port = 30001
http.port = 40001
