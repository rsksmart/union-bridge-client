#log_directory: "./logs" # Uncomment the following line to override the default log directory
logfile_prefix: "log-indexer"

# Global tracing level (e.g., ERROR, WARN, INFO, DEBUG, TRACE)
tracing_level: "DEBUG"
# Date and time format used in logs
date_time_format: "%Y-%m-%d %H:%M:%S%.3f"

# Optional: specify crates and their log levels (defaults: tungstenite=off, tokio_tungstenite=off)
filtered_crates:
  tarpc: "warn"
  tungstenite: "off"
  tokio_tungstenite: "off"
  alloy_transport_ws: "info"
  alloy_rpc_client: "debug"  

# If true, logs will be written to a file
enable_file_output: true
# If true, logs will be printed to stdout
enable_stdout: true
# If both file and console output are disabled, stdout will be enabled by default