services:
  bitvmx-client:
    image: ghcr.io/fairgatelabs/rust-bitvmx-workspace/bitvmx-client:v0.1.3-alpha
    # container_name: bitvmx-client-container
    restart: unless-stopped
    entrypoint: [ "./run.sh" ]
    environment:
      RUST_BACKTRACE: full
      CLIENT_OP: ${CLIENT_OP}
      BITCOIND_URL: ${BITCOIND_URL}
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f bitvmx-client" ] # Check bitvmx-client process is running
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      # for union-client -> bitvmx-client communication (through internal network)
      - ${BITVMX_PORT}:${BITVMX_PORT}
      # for bitvmx-client -> bitvmx-client communication (through shared network)
      - ${BITVMX_P2P_PORT}:${BITVMX_P2P_PORT}
    volumes:
      - ./config/${ENVIRONMENT}/client/config:/app/config
      - ./config/${ENVIRONMENT}/broker/config:/app/rust-bitvmx-workspace/rust-fakep2p/broker/config
      - db-bitvmx:/tmp

volumes:
  db-bitvmx: