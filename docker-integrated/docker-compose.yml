#####################################################################################################################################
# INTEGRATED DOCKER COMPOSE: BitVMX + Union Bridge Client
#####################################################################################################################################

services:
  # ================================
  # BitVMX Services
  # ================================
  bitvmx-client:
    platform: linux/amd64
    extends:
      file: ./bitvmx-client/docker-compose.yml
      service: bitvmx-client
    networks:
      bitvmx-union-network:

  # ================================
  # Union Bridge Client Services
  # ================================
  block-indexer:
    extends:
      file: ../docker/docker-compose.yml
      service: block-indexer
    networks:
      - bitvmx-union-network

  log-indexer:
    extends:
      file: ../docker/docker-compose.yml
      service: log-indexer
    networks:
      - bitvmx-union-network

  user-api:
    extends:
      file: ../docker/docker-compose.yml
      service: user-api
    networks:
      - bitvmx-union-network

  coordinator:
    extends:
      file: ../docker/docker-compose.yml
      service: coordinator
    depends_on:
      bitvmx-client:
        condition: service_healthy
    networks:
      bitvmx-union-network:

# ================================
# Networks and Volumes
# ================================
networks:
  bitvmx-union-network:
    driver: bridge

volumes:
  keystore:
  db-blocks:
  db-logs:
  db-coordinator:
  db-bitvmx: